<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #0E0B0A;
    --bg2: #171210;
    --border: #2A2320;
    --text: #F2E9E2;
    --text40: rgba(242,233,226,0.4);
    --text70: rgba(242,233,226,0.7);
    --sunset: #E8743C;
    --danger: #E85C4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    text-align: center;
  }
  p.sub {
    color: var(--text40);
    font-size: 13px;
    text-align: center;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text40);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 60px;
    padding: 15px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .error {
    background: rgba(232,92,74,0.1);
    border: 1px solid rgba(232,92,74,0.3);
    color: var(--danger);
    border-radius: 6px;
    padding: 12px;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .success { text-align: center; }
  .success h1 { margin-bottom: 12px; }
  .success p { color: var(--text70); font-size: 14px; line-height: 1.6; }
  .logo {
    text-align: center;
    letter-spacing: 6px;
    font-weight: 800;
    color: var(--sunset);
    margin-bottom: 24px;
    font-size: 18px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--sunset);
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">VAULT</div>
    <!-- Real, visible content by default — never a blank box, even if the
         script below fails before it can replace this. -->
    <div id="app">
      <div class="spinner"></div>
      <p class="sub" style="margin-top:16px;">Verifying your reset link...</p>
    </div>
  </div>

  <script>
    const app = document.getElementById("app");

    function renderForm(errorMsg) {
      app.innerHTML = `
        <h1>Set a new password</h1>
        <p class="sub">Choose a new password for your Vault account.</p>
        ${errorMsg ? `<div class="error">${errorMsg}</div>` : ""}
        <label>New Password</label>
        <input id="pw1" type="password" placeholder="At least 8 characters" />
        <label>Confirm Password</label>
        <input id="pw2" type="password" placeholder="Repeat password" />
        <button id="submitBtn">Update Password</button>
      `;
      document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    }

    function renderSuccess() {
      app.innerHTML = `
        <div class="success">
          <h1>Password updated</h1>
          <p>Your password has been changed.<br>Go back to the Vault app and sign in with your new password.</p>
        </div>
      `;
    }

    function renderInvalidLink(reason) {
      app.innerHTML = `
        <div class="success">
          <h1>Link expired</h1>
          <p>This password reset link is no longer valid. Go back to the Vault app and request a new one from the Sign In screen.</p>
          ${reason ? `<p style="margin-top:16px; font-size:11px; opacity:0.5;">(${reason})</p>` : ""}
        </div>
      `;
    }

    let supabase;
    let handledAlready = false;

    async function handleSubmit() {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;

      if (pw1.length < 8) return renderForm("Password must be at least 8 characters.");
      if (pw1 !== pw2) return renderForm("Passwords don't match.");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const { error } = await supabase.auth.updateUser({ password: pw1 });
        if (error) return renderForm(error.message);
        renderSuccess();
      } catch (e) {
        renderForm("Something went wrong: " + e.message);
      }
    }

    try {
      if (!window.supabase) {
        renderInvalidLink("Could not load the login library — check your connection and try opening the link again.");
      } else {
        const SUPABASE_URL = "https://shwtfcpyargginvodgpd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNod3RmY3B5YXJnZ2ludm9kZ3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MTgxNjYsImV4cCI6MjA5MDA5NDE2Nn0.zFOwrO2mLtUfo2XZIxlf3GTnu6tOwdzmrEhvxwVhIfw";
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Supabase's recovery link puts the session info in the URL hash and
        // fires this event once it's parsed it into a real, usable session.
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "PASSWORD_RECOVERY" && !handledAlready) {
            handledAlready = true;
            renderForm();
          }
        });

        // Fallback: if that event doesn't fire within 3 seconds (slow network,
        // or it already fired before this listener attached), check directly
        // for a session before assuming the link is bad.
        setTimeout(async () => {
          if (handledAlready) return;
          try {
            const { data } = await supabase.auth.getSession();
            if (data?.session) {
              handledAlready = true;
              renderForm();
            } else {
              renderInvalidLink();
            }
          } catch (e) {
            renderInvalidLink(e.message);
          }
        }, 3000);
      }
    } catch (e) {
      renderInvalidLink("Unexpected error: " + e.message);
    }
  </script>
</body>
</html>
