<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — Vault</title>
<style>
  :root {
    --bg: #0E0B0A;
    --bg2: #171210;
    --border: #2A2320;
    --text: #F2E9E2;
    --text40: rgba(242,233,226,0.4);
    --text70: rgba(242,233,226,0.7);
    --sunset: #E8743C;
    --danger: #E85C4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    text-align: center;
  }
  p.sub {
    color: var(--text40);
    font-size: 13px;
    text-align: center;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text40);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 16px;
  }
  button, a.button {
    display: block;
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 60px;
    padding: 15px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary, a.button.secondary {
    background: transparent;
    color: var(--text70);
    border: 1px solid var(--border);
    margin-top: 10px;
  }
  .error {
    background: rgba(232,92,74,0.1);
    border: 1px solid rgba(232,92,74,0.3);
    color: var(--danger);
    border-radius: 6px;
    padding: 12px;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .success { text-align: center; }
  .success h1 { margin-bottom: 12px; }
  .success p { color: var(--text70); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  .logo {
    text-align: center;
    letter-spacing: 6px;
    font-weight: 800;
    color: var(--sunset);
    margin-bottom: 24px;
    font-size: 18px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--sunset);
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  code.link {
    display: block;
    word-break: break-all;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text70);
    margin: 12px 0 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">VAULT</div>
    <!-- Real, visible content by default. The watchdog below is set up
         before anything else runs, so this can never be stuck for more
         than a few seconds no matter what fails. -->
    <div id="app">
      <div class="spinner"></div>
      <p class="sub" style="margin-top:16px;">Verifying your reset link...</p>
    </div>
  </div>

  <script>
    // ---- Everything in this block is plain inline JS with zero external
    // dependencies, so it is guaranteed to run immediately, no matter how
    // slow, blocked, or flaky the network is (this matters a lot inside
    // in-app browsers like Gmail's, which sometimes silently stall
    // third-party script loads instead of failing cleanly). ----

    const app = document.getElementById("app");
    let settled = false; // true once we've shown a real, final screen

    function renderForm() {
      if (settled) return;
      settled = true;
      app.innerHTML = `
        <h1>Set a new password</h1>
        <p class="sub">Choose a new password for your Vault account.</p>
        <div id="formError"></div>
        <label>New Password</label>
        <input id="pw1" type="password" placeholder="At least 8 characters" />
        <label>Confirm Password</label>
        <input id="pw2" type="password" placeholder="Repeat password" />
        <button id="submitBtn">Update Password</button>
      `;
      document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    }

    function showFormError(msg) {
      const box = document.getElementById("formError");
      if (box) box.innerHTML = `<div class="error">${msg}</div>`;
    }

    function renderSuccess() {
      settled = true;
      app.innerHTML = `
        <div class="success">
          <h1>Password updated</h1>
          <p>Your password has been changed.<br>Go back to the Vault app and sign in with your new password.</p>
        </div>
      `;
    }

    // A single, honest fallback screen for anything that goes wrong,
    // including the network/loading problem itself. Always actionable —
    // never a dead end.
    function renderProblem(reason) {
      if (settled) return;
      settled = true;
      const pageUrl = window.location.href;
      app.innerHTML = `
        <div class="success">
          <h1>Trouble loading this page</h1>
          <p>This can happen inside Gmail's built-in browser. Try opening this link in Safari instead — tap the <strong>•••</strong> or share icon at the bottom of this screen and choose "Open in Safari" or "Open in Browser."</p>
          <p style="font-size:11px; opacity:0.5; margin-bottom:8px;">Or copy this link and paste it into Safari:</p>
          <code class="link">${pageUrl}</code>
          <p style="font-size:11px; opacity:0.4;">Still stuck? Go back to the Vault app and request a new reset link.</p>
        </div>
      `;
    }

    function renderInvalidLink() {
      if (settled) return;
      settled = true;
      app.innerHTML = `
        <div class="success">
          <h1>Link expired</h1>
          <p>This password reset link is no longer valid. Go back to the Vault app and request a new one from the Sign In screen.</p>
        </div>
      `;
    }

    let supabaseClient = null;

    async function handleSubmit() {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;

      showFormError("");
      if (pw1.length < 8) return showFormError("Password must be at least 8 characters.");
      if (pw1 !== pw2) return showFormError("Passwords don't match.");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
        if (error) {
          showFormError(error.message);
          btn.disabled = false;
          btn.textContent = "Update Password";
          return;
        }
        renderSuccess();
      } catch (e) {
        showFormError("Something went wrong: " + e.message);
        btn.disabled = false;
        btn.textContent = "Update Password";
      }
    }

    // ---- Watchdog: guarantees this page NEVER sits frozen. No matter what
    // happens below (CDN blocked, slow network, unexpected error), after 6
    // seconds we show a real, actionable screen. ----
    const watchdog = setTimeout(() => {
      renderProblem("timeout");
    }, 6000);

    // ---- Load the Supabase library ourselves, with an explicit failure
    // handler, instead of a static <script src> tag that can silently
    // stall and block the whole page (this was the actual bug). ----
    function loadSupabaseThenInit() {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";

      script.onload = () => {
        try {
          initSupabase();
        } catch (e) {
          clearTimeout(watchdog);
          renderProblem(e.message);
        }
      };

      script.onerror = () => {
        clearTimeout(watchdog);
        renderProblem("could not load library");
      };

      document.head.appendChild(script);
    }

    async function initSupabase() {
      if (!window.supabase) {
        clearTimeout(watchdog);
        renderProblem("library missing after load");
        return;
      }

      const SUPABASE_URL = "https://shwtfcpyargginvodgpd.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNod3RmY3B5YXJnZ2ludm9kZ3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MTgxNjYsImV4cCI6MjA5MDA5NDE2Nn0.zFOwrO2mLtUfo2XZIxlf3GTnu6tOwdzmrEhvxwVhIfw";

      // We parse the reset link ourselves instead of letting the library
      // auto-detect it, so this works whichever link format Supabase sends.
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { detectSessionInUrl: false, persistSession: true },
      });

      try {
        // Format 1: tokens in the URL hash (#access_token=...&type=recovery)
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");

        if (accessToken && refreshToken) {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          });
          clearTimeout(watchdog);
          if (error) return renderInvalidLink();
          return renderForm();
        }

        // Format 2: a one-time code in the query string (?code=...)
        const query = new URLSearchParams(window.location.search);
        const code = query.get("code");

        if (code) {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
          clearTimeout(watchdog);
          if (error) return renderInvalidLink();
          return renderForm();
        }

        // Neither format found — check if a session already exists for
        // some other reason before giving up.
        const { data } = await supabaseClient.auth.getSession();
        clearTimeout(watchdog);
        if (data && data.session) return renderForm();
        return renderInvalidLink();
      } catch (e) {
        clearTimeout(watchdog);
        renderProblem(e.message);
      }
    }

    loadSupabaseThenInit();
  </script>
</body>
</html>
