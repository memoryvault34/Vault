<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed — Vault</title>
<style>
  :root {
    --bg: #0E0B0A;
    --bg2: #171210;
    --border: #2A2320;
    --text: #F2E9E2;
    --text40: rgba(242,233,226,0.4);
    --text70: rgba(242,233,226,0.7);
    --sunset: #E8743C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 28px;
    text-align: center;
  }
  .logo {
    letter-spacing: 6px;
    font-weight: 800;
    color: var(--sunset);
    margin-bottom: 24px;
    font-size: 18px;
  }
  .check {
    width: 56px;
    height: 56px;
    border-radius: 28px;
    background: rgba(232,116,60,0.15);
    color: var(--sunset);
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 { font-size: 21px; margin: 0 0 12px; }
  p { color: var(--text40); font-size: 13px; line-height: 1.6; margin: 0 0 28px; }
  a.button {
    display: block;
    background: var(--text);
    color: var(--bg);
    text-decoration: none;
    border: none;
    border-radius: 60px;
    padding: 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .fallback {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text40);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">VAULT</div>
    <div class="check">✓</div>
    <h1>Your email is confirmed</h1>
    <p>You're all set. Tap below to open Vault and sign in.</p>
    <a class="button" id="openBtn" href="vaultapp://">Open Vault →</a>
    <p class="fallback">If nothing happens, open the Vault app on your phone directly and sign in there.</p>
  </div>

  <script>
    // Try to open the app automatically as soon as the page loads, since
    // some mail apps let this through without needing a tap. The visible
    // button above is the reliable fallback for browsers that block
    // automatic custom-scheme redirects (most do, by design).
    window.location.href = "vaultapp://";
  </script>
</body>
</html>
