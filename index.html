// ── Time of day theming ───────────────────────────────────────
function getTimeOfDay() {
  const h = new Date().getHours();
  if (h >= 5 && h < 8) return "dawn";
  if (h >= 8 && h < 12) return "morning";
  if (h >= 12 && h < 16) return "midday";
  if (h >= 16 && h < 19) return "golden";
  if (h >= 19 && h < 22) return "evening";
  return "night";
}

function applyTimeOfDay() {
  document.body.setAttribute("data-tod", getTimeOfDay());
}
applyTimeOfDay();
// Update every 5 minutes

// ── Supabase data layer ───────────────────────────────────────
const db = {
  async getProfile(userId) {
    const { data } = await supabase.from("profiles").select("*").eq("id", userId).single();
    return data;
  },
  async updateProfile(userId, updates) {
    const { data } = await supabase.from("profiles").update(updates).eq("id", userId).select().single();
    return data;
  },
  async getVaults(userId) {
    const { data } = await supabase.from("vaults").select("*").eq("user_id", userId).order("sort_order").order("created_at");
    return data || [];
  },
  async createVault(userId, vault) {
    const { data } = await supabase.from("vaults").insert({ ...vault, user_id: userId }).select().single();
    return data;
  },
  async deleteVault(vaultId) {
    await supabase.from("vaults").delete().eq("id", vaultId);
  },
  async getMemories(userId) {
    const { data } = await supabase.from("memories").select("*").eq("user_id", userId).order("memory_date");
    return data || [];
  },
  async createMemory(userId, memory) {
    const { data } = await supabase.from("memories").insert({ ...memory, user_id: userId }).select().single();
    return data;
  },
  async deleteMemory(memoryId) {
    await supabase.from("memories").delete().eq("id", memoryId);
  },
  async getMilestones(userId) {
    const { data } = await supabase.from("milestones").select("*").eq("user_id", userId).order("milestone_date");
    return data || [];
  },
  async createMilestone(userId, milestone) {
    const { data } = await supabase.from("milestones").insert({ ...milestone, user_id: userId }).select().single();
    return data;
  },
  async uploadPhoto(userId, file) {
    // Always use jpg since we compress to jpeg
    const path = `${userId}/${uid()}.jpg`;
    const { error } = await supabase.storage.from("memory-photos").upload(path, file, { 
      upsert: false,
      contentType: "image/jpeg"
    });
    if (error) {
      console.error("Storage upload error:", error);
      throw error;
    }
    const { data: { publicUrl } } = supabase.storage.from("memory-photos").getPublicUrl(path);
    console.log("Uploaded photo URL:", publicUrl);
    return { url: publicUrl, path };
  },
  async deletePhoto(path) {
    await supabase.storage.from("memory-photos").remove([path]);
  },

// ── Real AI analysis via Cloudflare Worker ─────────────────────
async function analyzePhotosWithAI(photos, cfg, vaultName) {
  try {
    const response = await fetch(NETLIFY_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        photos: photos.map(p => ({ id: p.id, name: p.name, src: p.src, date: p.date })),
        prompt: cfg.prompt,
        dateFrom: cfg.from,
        dateTo: cfg.to,
        vaultName: vaultName || "",
      }),
    });
    if (!response.ok) throw new Error("AI function error");
    const { results } = await response.json();
    return results;
  } catch (err) {
    console.warn("AI analysis failed, using fallback:", err);
    return photos.map(p => ({
      ...p,
      aiScore: 0.8,
      aiReason: "Included by default",
      aiTitle: null,
      aiDescription: null,
      aiPick: true,
    }));
  }
}

function Spinner({ size=14, color="var(--text)" }) {
  return <div style={{ width:`${size}px`, height:`${size}px`, border:`1.5px solid ${color}`, borderTopColor:"transparent", borderRadius:"50%", animation:"spin 0.7s linear infinite", flexShrink:0 }} />;
}
function Modal({ onClose, children, maxWidth="480px" }) {
  useEffect(() => {
    const fn = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [onClose]);
  return (
    <div className="fi" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(8,5,4,0.92)", backdropFilter:"blur(20px)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>

        {children}
      </div>
    </div>
  );
}
function Toast({ message, type="success", onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, [onDone]);
  const bg = type === "error" ? "rgba(180,50,50,0.95)" : "rgba(232,116,60,0.95)";

      {message}
    </div>
  );
}

function Auth({ onAuth }) {
  const [screen, setScreen] = useState("land");
  const [f, setF] = useState({ name:"", email:"", password:"", dob:"" });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [resetSent, setResetSent] = useState(false);
  const [confirmSent, setConfirmSent] = useState(false);
  const [resending, setResending] = useState(false);
  const [resendDone, setResendDone] = useState(false);

  const submit = async () => {
    if (!f.email || !f.password) { setErr("Please fill in all fields."); return; }
    if (screen === "signup" && !f.name) { setErr("Enter your name."); return; }
    setLoading(true); setErr("");

    if (screen === "signup") {
      const { data, error } = await supabase.auth.signUp({
        email: f.email,
        password: f.password,
        options: { data: { name: f.name } },
      });
      if (error) { setErr(error.message); setLoading(false); return; }
      if (data.user) {
        await supabase.from("profiles").update({ name: f.name, dob: f.dob || null }).eq("id", data.user.id);
      }
      setLoading(false);
      setConfirmSent(true); // Show confirmation screen instead of logging in
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email: f.email, password: f.password });
      if (error) {
        // If email not confirmed, show helpful message
        if (error.message.includes("Email not confirmed")) {
          setErr("Please confirm your email first. Check your inbox — or resend below.");
          setConfirmSent(true);
        } else {
          setErr(error.message);
        }
        setLoading(false); return;
      }
      const profile = await db.getProfile(data.user.id);
      onAuth({ ...data.user, name: profile?.name || f.email.split("@")[0], isNew: false });
    }
    setLoading(false);
  };

  const resendConfirmation = async () => {
    setResending(true);
    const { error } = await supabase.auth.resend({ type:"signup", email: f.email });
    setResending(false);
    if (!error) setResendDone(true);
  };

  const resetPassword = async () => {
    if (!f.email) { setErr("Enter your email first."); return; }
    setLoading(true);
    const { error } = await supabase.auth.resetPasswordForEmail(f.email, {
      redirectTo: window.location.origin,
    });
    setLoading(false);
    if (error) { setErr(error.message); return; }
    setResetSent(true);

      <div style={{ position:"absolute", top:"-5%", right:"10%", width:"600px", height:"600px", borderRadius:"50%", background:"radial-gradient(ellipse,rgba(232,116,60,0.18) 0%,transparent 70%)", filter:"blur(60px)", pointerEvents:"none" }} />
      <div style={{ position:"absolute", bottom:"10%", left:"5%", width:"400px", height:"400px", borderRadius:"50%", background:"radial-gradient(ellipse,rgba(180,60,20,0.12) 0%,transparent 70%)", filter:"blur(60px)", pointerEvents:"none" }} />

// ══════════════════════════════════════════════════════════════
//  GOLDEN THREAD
// ══════════════════════════════════════════════════════════════
function GoldenThread({ milestones, vaults, memories, onVaultOpen }) {
  const [activeI, setActiveI] = useState(0);
  const refs = useRef({});

  // Build combined timeline events
  const timelineEvents = [];

  // Add time-bound vaults as "vault" events (with start_date)
  vaults.forEach(v => {
    if (v.start_date && ["travel","relationship","era"].includes(v.vault_type)) {
      timelineEvents.push({
        id: `vault-${v.id}`,
        type: "vault",
        vault: v,
        date: v.start_date,
        endDate: v.end_date,
        title: v.name,
        emoji: v.icon,
        label: v.vault_type === "travel" ? "Trip" : v.vault_type === "relationship" ? "Love" : "Era",
      });
    }
  });

  // Add milestones
  milestones.forEach(m => {
    timelineEvents.push({
      id: m.id,
      type: "milestone",
      date: m.milestone_date || m.date,
      title: m.title,
      emoji: m.emoji,
      label: m.label,
      vault_id: m.vault_id,
    });
  });

  // Add lifelong vault memories (people/solo)
  memories?.forEach(m => {
    const v = vaults.find(vv => vv.id === (m.vault_id || m.vaultId));
    if (v && ["people","solo"].includes(v.vault_type)) {
      timelineEvents.push({
        id: `mem-${m.id}`,
        type: "memory",
        date: m.memory_date || m.date,
        title: m.title,
        emoji: m.emoji || "📷",
        label: v.name,
        vault: v,
        memory: m,
      });
    }
  });

  const sorted = timelineEvents.sort((a,b) => new Date(a.date) - new Date(b.date));

  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActiveI(+e.target.dataset.i); });
    }, { threshold:0.6, rootMargin:"-35% 0px -35% 0px" });
    Object.values(refs.current).forEach(el => el && obs.observe(el));
    return () => obs.disconnect();
  }, [sorted.length]);

  return (
    <div className="thread-container" style={{ position:"relative", padding:"60px 0 100px" }}>
      <div className="thread-line" />
      <div className="thread-glow" />
      {sorted.map((ev, i) => {
        const vault = ev.vault || (ev.vault_id ? vaults.find(v => v.id === ev.vault_id) : null);
        const isLeft = i % 2 === 0;
        const isActive = activeI === i;
        return (
          <div key={ev.id} data-i={i} ref={el => refs.current[i] = el}
            style={{ display:"flex", alignItems:"center", marginBottom:"56px", opacity:isActive?1:0.45, transition:"opacity 0.4s ease" }}>
            <div style={{ flex:1, paddingRight:"50px", textAlign:"right" }}>
              {isLeft && <ThreadCard ev={ev} date={ev.date} vault={vault} dir="right" onVaultOpen={onVaultOpen} />}
            </div>
            <div className={`thread-dot ${isActive?"active":""}`} />
            <div style={{ flex:1, paddingLeft:"50px" }}>
              {!isLeft && <ThreadCard ev={ev} date={ev.date} vault={vault} dir="left" onVaultOpen={onVaultOpen} />}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  AI PHOTO IMPORT
// ══════════════════════════════════════════════════════════════
function AIImport({ vault, userId, onDone, onClose }) {
  const [step, setStep] = useState("cfg");
  const [cfg, setCfg] = useState({ label:"", from:"", to:"", prompt:"" });
  const [photos, setPhotos] = useState([]);
  const [results, setResults] = useState([]);
  const [picked, setPicked] = useState(new Set());
  const [prog, setProg] = useState(0);
  const [uploading, setUploading] = useState(false);
  const dropRef = useRef();
  const fileRef = useRef();

  const compressImage = (src, maxSize=800, quality=0.6) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = src;
    });
  };

  const loadFiles = files => {
    const imgs = []; let done = 0;
    const valid = Array.from(files).filter(f => f.type.startsWith("image/"));
    if (!valid.length) return;
    valid.forEach(f => {
      const r = new FileReader();
      r.onload = async e => {
        // Compress aggressively for AI analysis (small = faster, cheaper)
        const compressed = await compressImage(e.target.result, 512, 0.5);
        // Keep a medium quality version for storage
        const forStorage = await compressImage(e.target.result, 1200, 0.8);
        imgs.push({ id:uid(), name:f.name, src:compressed, storageBlob:forStorage, date:new Date(f.lastModified).toISOString().split("T")[0] });
        done++;
        if (done === valid.length) setPhotos(p => [...p, ...imgs]);
      };
      r.readAsDataURL(f);
    });
  };

  const scan = async () => {
    if (!photos.length) return;
    setStep("scanning"); setProg(0);
    const iv = setInterval(() => setProg(p => { const n = p + Math.random()*7; if(n>=90) clearInterval(iv); return Math.min(n,90); }), 250);
    const r = await analyzePhotosWithAI(photos, cfg, vault.name);
    clearInterval(iv); setProg(100);
    // Merge src back into results so the review screen can show photos
    const enriched = r.map(result => {
      const orig = photos.find(p => p.id === result.id);
      return { ...result, src: orig?.src || result.src };
    });
    setTimeout(() => { setResults(enriched); setPicked(new Set(enriched.filter(x=>x.aiPick).map(x=>x.id))); setStep("review"); }, 400);
  };

  const finish = async () => {
    setUploading(true);
    const chosen = results.filter(r => picked.has(r.id));
    const saved = [];
    for (const photo of chosen) {
      try {
        let photoUrl = null, photoPath = null;

        // Match back to original photo to get storageBlob
        const originalPhoto = photos.find(p => p.id === photo.id);
        const blobSrc = originalPhoto?.storageBlob || originalPhoto?.src || photo.src;

        if (blobSrc && blobSrc.startsWith("data:")) {
          try {
            const res = await fetch(blobSrc);
            const blob = await res.blob();
            const compressedFile = new File([blob], `memory-${uid()}.jpg`, { type: "image/jpeg" });
            const uploaded = await db.uploadPhoto(userId, compressedFile);
            photoUrl = uploaded.url;
            photoPath = uploaded.path;
          } catch(uploadErr) {
            console.error("Upload failed:", uploadErr);
          }
        }

        const title = photo.aiTitle
          || photo.name?.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ")
          || "Memory";
        const mem = await db.createMemory(userId, {
          vault_id: vault.id,
          title,
          description: photo.aiDescription || "Added via AI import.",
          memory_date: photo.date || cfg.from || new Date().toISOString().split("T")[0],
          emoji: "📷",
          photo_url: photoUrl,
          photo_path: photoPath,
          ai_imported: true,
        });
        if (mem) saved.push(mem);
      } catch (e) {
        console.error("Failed to save memory:", e);
      }
    }
    setUploading(false);
    onDone(saved);
  };

  const STEPS = ["cfg","scanning","review"];

  return (
    <div className="fi" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(10,5,2,0.92)", backdropFilter:"blur(16px)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
      <div className="si" onClick={e => e.stopPropagation()} style={{ background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"24px", width:"100%", maxWidth:"640px", maxHeight:"92vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
        {/* Header */}
        <div style={{ background:`linear-gradient(135deg,${vault.color}30,transparent)`, padding:"24px 28px 18px", borderBottom:"1px solid var(--borderS)", flexShrink:0 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
            <div>
              <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", letterSpacing:"0.2em", color:vault.color, textTransform:"uppercase", marginBottom:"4px" }}>AI Photo Import</div>
              <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"20px", fontWeight:700, color:"var(--cream)" }}>{vault.icon} &nbsp;{vault.name}</div>
            </div>
            <button onClick={onClose} style={{ color:"var(--cream40)", fontSize:"20px" }}>✕</button>
          </div>
          <div style={{ display:"flex", marginTop:"18px" }}>
            {["Configure","AI Scanning","Review"].map((s, i) => (
              <div key={s} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:"5px" }}>
                <div style={{ width:"100%", height:"2px", background:i<=STEPS.indexOf(step)?"var(--sunset3)":"var(--borderS)", transition:"background 0.4s" }} />
                <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", letterSpacing:"0.1em", color:i<=STEPS.indexOf(step)?"var(--sunset4)":"var(--cream40)", textTransform:"uppercase" }}>{s}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ flex:1, overflowY:"auto", padding:"24px 28px" }}>
          {/* CONFIGURE */}
          {step === "cfg" && (
            <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>
              <p style={{ fontFamily:"'Raleway',sans-serif", fontSize:"14px", color:"var(--cream70)", fontWeight:300, lineHeight:1.75 }}>
                Claude Vision AI will actually <em>look</em> at your photos — detecting faces, locations, emotions, and events — then pre-select the ones that match what you describe. You make the final call.
              </p>
              <div><Lbl>Vault Theme</Lbl><FInput value={cfg.label} onChange={v => setCfg({...cfg,label:v})} placeholder="e.g. College Years, Europe Trip 2023" /></div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" }}>
                <div><Lbl>Date From</Lbl><FInput type="date" value={cfg.from} onChange={v => setCfg({...cfg,from:v})} /></div>
                <div><Lbl>Date To</Lbl><FInput type="date" value={cfg.to} onChange={v => setCfg({...cfg,to:v})} /></div>
              </div>
              <div>
                <Lbl>What should the AI look for?</Lbl>
                <textarea value={cfg.prompt} onChange={e => setCfg({...cfg,prompt:e.target.value})} placeholder="e.g. Group photos, celebrations, outdoor adventures, moments with specific people..."
                  style={{ width:"100%", background:"var(--bg1)", border:"1px solid var(--borderS)", borderRadius:"10px", padding:"12px 14px", color:"var(--cream)", fontSize:"13px", fontFamily:"'Raleway',sans-serif", fontWeight:300, resize:"vertical", minHeight:"80px", lineHeight:1.6 }} />
              </div>
              <div ref={dropRef}
                onDragOver={e => { e.preventDefault(); dropRef.current.style.borderColor="var(--sunset3)"; }}
                onDragLeave={() => dropRef.current.style.borderColor="var(--borderS)"}
                onDrop={e => { e.preventDefault(); dropRef.current.style.borderColor="var(--borderS)"; loadFiles(e.dataTransfer.files); }}
                onClick={() => fileRef.current.click()}
                style={{ border:"2px dashed var(--borderS)", borderRadius:"14px", padding:"28px 20px", textAlign:"center", cursor:"pointer", transition:"all 0.2s" }}>
                <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={e => loadFiles(e.target.files)} />
                <div style={{ fontSize:"28px", marginBottom:"10px" }}>📸</div>
                <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--cream40)", fontWeight:300, lineHeight:1.65 }}>
                  Drop camera roll photos here or <span style={{ color:"var(--sunset4)" }}>browse files</span>
                </div>
                {photos.length > 0 && <div style={{ marginTop:"10px", fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--sunset3)", fontWeight:500 }}>✓ {photos.length} photo{photos.length>1?"s":""} loaded</div>}
              </div>
              <button onClick={scan} disabled={!photos.length}
                style={{ background:photos.length?"linear-gradient(135deg,var(--sunset1),var(--sunset3))":"var(--bg3)", color:photos.length?"var(--cream)":"var(--cream40)", border:"none", borderRadius:"10px", padding:"15px", fontFamily:"'Raleway',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", boxShadow:photos.length?"0 4px 20px rgba(196,92,42,0.4)":"none", cursor:photos.length?"pointer":"not-allowed" }}>
                {photos.length ? `Analyze ${photos.length} Photo${photos.length>1?"s":""} with AI →` : "Add Photos First"}
              </button>
            </div>
          )}

          {/* SCANNING */}
          {step === "scanning" && (
            <div style={{ textAlign:"center", padding:"40px 20px" }}>
              <div style={{ fontSize:"42px", marginBottom:"22px", display:"inline-block", animation:"spin 2.5s linear infinite" }}>✦</div>
              <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"22px", fontWeight:700, color:"var(--cream)", marginBottom:"10px" }}>Claude is scanning your photos…</div>
              <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--cream40)", fontWeight:300, marginBottom:"32px", lineHeight:1.75 }}>
                Analyzing faces, locations, emotions &<br/>identifying your most meaningful moments.
              </div>
              <div style={{ background:"var(--bg1)", borderRadius:"40px", height:"4px", overflow:"hidden", maxWidth:"340px", margin:"0 auto" }}>
                <div style={{ height:"100%", width:`${prog}%`, background:"linear-gradient(90deg,var(--sunset1),var(--gold2))", borderRadius:"40px", transition:"width 0.3s ease", boxShadow:"0 0 12px var(--sunset3)" }} />
              </div>
              <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"11px", color:"var(--cream40)", marginTop:"12px" }}>{Math.round(prog)}% complete</div>
            </div>
          )}

          {/* REVIEW */}
          {step === "review" && (
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"14px" }}>
                <div>
                  <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"17px", fontWeight:700, color:"var(--cream)" }}>
                    AI selected {results.filter(r=>r.aiPick).length} of {results.length} photos
                  </div>
                  <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"12px", color:"var(--cream40)", fontWeight:300, marginTop:"2px" }}>Toggle to adjust — you have the final say.</div>
                </div>
                <div style={{ display:"flex", gap:"8px" }}>
                  <button onClick={() => setPicked(new Set(results.map(r=>r.id)))} style={{ background:"var(--bg3)", border:"1px solid var(--borderS)", color:"var(--cream70)", borderRadius:"8px", padding:"5px 12px", fontSize:"11px", fontFamily:"'Raleway',sans-serif" }}>All</button>
                  <button onClick={() => setPicked(new Set())} style={{ background:"var(--bg3)", border:"1px solid var(--borderS)", color:"var(--cream70)", borderRadius:"8px", padding:"5px 12px", fontSize:"11px", fontFamily:"'Raleway',sans-serif" }}>None</button>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:"10px", marginBottom:"20px" }}>
                {results.map(ph => {
                  const sel = picked.has(ph.id);
                  // Look up the original photo for src since results don't include it
                  const originalPhoto = photos.find(p => p.id === ph.id);
                  const imgSrc = ph.src || originalPhoto?.src;
                  return (
                    <div key={ph.id} onClick={() => { const s = new Set(picked); sel ? s.delete(ph.id) : s.add(ph.id); setPicked(s); }}
                      style={{ position:"relative", height:"260px", borderRadius:"12px", overflow:"hidden", cursor:"pointer", border:`2px solid ${sel?"var(--gold)":"transparent"}`, transition:"all 0.2s", background:"var(--bg3)" }}>
                      {imgSrc && <img src={imgSrc} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", opacity:sel?1:0.4, transition:"opacity 0.2s" }} />}
                      {sel && <div style={{ position:"absolute", top:"8px", right:"8px", width:"24px", height:"24px", borderRadius:"50%", background:"var(--gold)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"12px", color:"var(--bg0)", fontWeight:700, zIndex:2 }}>✓</div>}
                      {ph.mood && ph.mood !== "unknown" && (
                        <div style={{ position:"absolute", top:"8px", left:"8px", background:"rgba(0,0,0,0.7)", borderRadius:"20px", padding:"3px 9px", fontSize:"10px", color:"rgba(255,255,255,0.9)", fontFamily:"'Raleway',sans-serif", textTransform:"capitalize", zIndex:2 }}>{ph.mood}</div>
                      )}
                      {(ph.aiTitle || ph.aiDescription) && (
                        <div style={{ position:"absolute", bottom:0, left:0, right:0, background:"linear-gradient(transparent 0%,rgba(0,0,0,0.6) 30%,rgba(0,0,0,0.92) 100%)", padding:"30px 10px 10px" }}>
                          {ph.aiTitle && <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"13px", fontWeight:700, color:"#fff", marginBottom:"4px", lineHeight:1.2 }}>{ph.aiTitle}</div>}
                          {ph.aiDescription && <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", color:"rgba(255,255,255,0.75)", fontWeight:300, lineHeight:1.4 }}>{ph.aiDescription}</div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <button onClick={finish} disabled={uploading || picked.size === 0}
                style={{ width:"100%", background:picked.size?"linear-gradient(135deg,var(--sunset1),var(--sunset3))":"var(--bg3)", color:picked.size?"var(--cream)":"var(--cream40)", border:"none", borderRadius:"10px", padding:"15px", fontFamily:"'Raleway',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", boxShadow:picked.size?"0 4px 20px rgba(196,92,42,0.4)":"none", display:"flex", alignItems:"center", justifyContent:"center", gap:"10px" }}>
                {uploading ? <><Spinner />Saving photos...</> : `Add ${picked.size} Photo${picked.size!==1?"s":""} to Vault →`}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  SLIDESHOW
// ══════════════════════════════════════════════════════════════
function Slideshow({ mems, vault, onClose }) {
  const [i, setI] = useState(0);
  const [vis, setVis] = useState(true);
  const [play, setPlay] = useState(true);
  const timerRef = useRef();

  const go = useCallback(dir => {
    setVis(false);
    setTimeout(() => { setI(p => (p+dir+mems.length)%mems.length); setVis(true); }, 280);
  }, [mems.length]);

  useEffect(() => {
    if (play) timerRef.current = setInterval(() => go(1), 3800);
    return () => clearInterval(timerRef.current);
  }, [play, go]);

  useEffect(() => {
    const fn = e => { if(e.key==="Escape")onClose(); if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1); };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [go, onClose]);

  const m = mems[i]; if (!m) return null;
  const src = m.photo_url || m.src;
  const date = m.memory_date || m.date;
  return (
    <div className="fi" style={{ position:"fixed", inset:0, background:"#000", zIndex:400, display:"flex", flexDirection:"column" }}>
      <div style={{ flex:1, position:"relative", overflow:"hidden" }}>
        {src
          ? <img src={src} style={{ width:"100%", height:"100%", objectFit:"contain", opacity:vis?1:0, transition:"opacity 0.28s" }} alt="" />
          : <div style={{ width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg0)", opacity:vis?1:0, transition:"opacity 0.28s", fontSize:"90px" }}>{m.emoji}</div>
        }
        <div style={{ position:"absolute", inset:0, background:"linear-gradient(to top,rgba(15,5,0,0.85) 0%,transparent 45%)", pointerEvents:"none" }} />
        <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"40px 40px", opacity:vis?1:0, transition:"opacity 0.28s" }}>
          <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"11px", letterSpacing:"0.2em", color:"var(--sunset4)", textTransform:"uppercase", marginBottom:"8px" }}>{fmtShort(date)}</div>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"clamp(22px,4vw,44px)", fontWeight:900, color:"var(--cream)", marginBottom:"10px", lineHeight:1.05 }}>{m.title}</div>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"16px", fontStyle:"italic", color:"var(--cream70)", maxWidth:"480px", lineHeight:1.75 }}>"{m.description||m.desc}"</div>
        </div>
        <button onClick={() => go(-1)} style={{ position:"absolute", left:"16px", top:"50%", transform:"translateY(-50%)", background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--cream)", borderRadius:"50%", width:"44px", height:"44px", fontSize:"20px" }}>‹</button>
        <button onClick={() => go(1)}  style={{ position:"absolute", right:"16px", top:"50%", transform:"translateY(-50%)", background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--cream)", borderRadius:"50%", width:"44px", height:"44px", fontSize:"20px" }}>›</button>
      </div>
      <div style={{ display:"flex", gap:"3px", padding:"10px 20px", background:"rgba(0,0,0,0.7)" }}>
        {mems.map((_, j) => <div key={j} onClick={() => setI(j)} style={{ flex:1, height:"2px", background:j===i?"var(--gold)":"rgba(245,237,224,0.2)", borderRadius:"2px", cursor:"pointer", transition:"background 0.2s" }} />)}
      </div>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 24px 18px", background:"rgba(0,0,0,0.7)" }}>
        <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"12px", color:"var(--cream40)", fontWeight:300 }}>{i+1} / {mems.length}</div>
        <div style={{ display:"flex", gap:"10px" }}>
          <button onClick={() => setPlay(!play)} style={{ background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--cream)", borderRadius:"8px", padding:"8px 16px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", letterSpacing:"0.1em" }}>{play?"⏸ Pause":"▶ Play"}</button>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid var(--borderS)", color:"var(--cream40)", borderRadius:"8px", padding:"8px 16px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", letterSpacing:"0.1em" }}>✕ Close</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  COLLAGE
// ══════════════════════════════════════════════════════════════
function Collage({ mems, vault, onClose }) {
  const items = mems.slice(0, 6);
  return (
    <div className="fi" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(10,4,0,0.94)", backdropFilter:"blur(18px)", zIndex:400, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
      <div className="si" onClick={e => e.stopPropagation()} style={{ width:"100%", maxWidth:"780px" }}>
        <div style={{ textAlign:"center", marginBottom:"20px" }}>
          <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", letterSpacing:"0.24em", color:"var(--sunset3)", textTransform:"uppercase", marginBottom:"6px" }}>{vault.name} Vault</div>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"28px", fontWeight:900, color:"var(--cream)" }}>Memory Collage</div>
        </div>
        <div className="collage-grid" style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gridTemplateRows:"repeat(2,190px)", gap:"6px", borderRadius:"16px", overflow:"hidden" }}>
          {items.map((m, idx) => {
            const big = idx === 0;
            const src = m.photo_url || m.src;
            return (
              <div key={m.id} style={{ gridColumn:big?"span 2":"span 1", gridRow:big?"span 2":"span 1", position:"relative", overflow:"hidden", background:"var(--bg2)" }}>
                {src
                  ? <img src={src} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
                  : <div style={{ width:"100%", height:"100%", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", background:`radial-gradient(ellipse,${vault.color}30,var(--bg2))` }}>
                      <div style={{ fontSize:big?"52px":"28px" }}>{m.emoji}</div>
                      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:big?"15px":"11px", color:"var(--cream70)", textAlign:"center", padding:"0 10px", marginTop:"8px", fontWeight:700 }}>{m.title}</div>
                    </div>
                }
                <div style={{ position:"absolute", inset:0, background:"linear-gradient(to top,rgba(0,0,0,0.65) 0%,transparent 50%)", opacity:0, transition:"opacity 0.2s" }}
                  onMouseEnter={e => e.currentTarget.style.opacity="1"}
                  onMouseLeave={e => e.currentTarget.style.opacity="0"}>
                  <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 10px" }}>
                    <div style={{ fontFamily:"'Playfair Display',serif", fontSize:big?"14px":"11px", fontWeight:700, color:"#fff" }}>{m.title}</div>
                    <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", color:"rgba(255,255,255,0.6)", marginTop:"2px" }}>{fmtShort(m.memory_date||m.date)}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", justifyContent:"center", marginTop:"18px" }}>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid var(--borderS)", color:"var(--cream40)", borderRadius:"10px", padding:"10px 24px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  MEMORY ROW
// ══════════════════════════════════════════════════════════════
function MemRow({ m, last, vc, onDelete }) {
  const [h, setH] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const src = m.photo_url || m.src;
  const date = m.memory_date || m.date;
  return (
    <>
      <div style={{ display:"flex", alignItems:"stretch" }} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
        <div style={{ width:"100px", flexShrink:0, paddingTop:"20px", paddingRight:"16px", textAlign:"right" }}>
          <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"11px", color:"var(--cream40)", fontWeight:300, lineHeight:1.5 }}>
            {fmtMed(date)}<br/><span style={{ fontSize:"10px", opacity:0.6 }}>{getYr(date)}</span>
          </div>
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", width:"18px", flexShrink:0 }}>
          <div style={{ width:"8px", height:"8px", borderRadius:"50%", background:src?vc:"transparent", border:`1.5px solid ${vc}`, marginTop:"24px", flexShrink:0, boxShadow:`0 0 0 3px var(--bg1)`, zIndex:1 }} />
          {!last && <div style={{ flex:1, width:"1px", background:"var(--borderS)", marginTop:"4px" }} />}
        </div>
        <div style={{ flex:1, marginLeft:"14px", marginBottom:"10px", marginTop:"10px", background:h?"rgba(196,92,42,0.08)":"rgba(245,237,224,0.02)", border:`1px solid ${h?"rgba(196,92,42,0.25)":"var(--borderS)"}`, borderRadius:"12px", padding:"14px 16px", transition:"all 0.25s", transform:h?"translateX(4px)":"none", display:"flex", gap:"12px", alignItems:"flex-start", position:"relative" }}>
          {src && <img src={src} alt="" style={{ width:"52px", height:"52px", borderRadius:"8px", objectFit:"cover", flexShrink:0 }} />}
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"16px", fontWeight:700, color:"var(--cream)", marginBottom:"3px" }}>{m.title}</div>
            <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--cream40)", fontWeight:300, lineHeight:1.6 }}>{m.description||m.desc}</div>
          </div>
          {!src && <div style={{ fontSize:"18px", opacity:0.5 }}>{m.emoji}</div>}
          {h && (
            <button onClick={() => setConfirmDel(true)} style={{ position:"absolute", top:"8px", right:"10px", color:"rgba(200,60,60,0.5)", fontSize:"13px", padding:"2px 6px", borderRadius:"4px", transition:"color 0.15s" }}
              onMouseEnter={e => e.target.style.color="#F08080"}
              onMouseLeave={e => e.target.style.color="rgba(200,60,60,0.5)"}>✕</button>
          )}
        </div>
      </div>
      {confirmDel && (
        <ConfirmModal
          title="Delete this memory?"
          body={`"${m.title}" will be permanently removed.`}
          confirmLabel="Delete"
          confirmDanger
          onConfirm={() => { setConfirmDel(false); onDelete(m); }}
          onCancel={() => setConfirmDel(false)}
        />
      )}
    </>
  );
}

// ══════════════════════════════════════════════════════════════
//  VAULT DETAIL VIEW
// ══════════════════════════════════════════════════════════════
function VaultView({ vault, mems, userId, onBack, onMemAdded, onMemDeleted, onImportAI, isDemo }) {
  const [showSS, setShowSS] = useState(false);
  const [showColl, setShowColl] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [nm, setNm] = useState({ title:"", date:"", desc:"" });
  const [imgFile, setImgFile] = useState(null);
  const [imgPrev, setImgPrev] = useState(null);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const fileRef = useRef();

  const byYear = {};
  [...mems].sort((a,b) => new Date(a.memory_date||a.date)-new Date(b.memory_date||b.date)).forEach(m => {
    const y = getYr(m.memory_date||m.date);
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(m);
  });
  const years = Object.keys(byYear).sort((a,b) => +a-+b);

  const saveAdd = async () => {
    if (!nm.title || !nm.date) return;
    setSaving(true);
    try {
      let photoUrl = null, photoPath = null;
      if (imgFile && !isDemo) {
        const uploaded = await db.uploadPhoto(userId, imgFile);
        photoUrl = uploaded.url;
        photoPath = uploaded.path;
      }
      if (isDemo) {
        // Demo mode: just create local object
        onMemAdded({ id:uid(), vault_id:vault.id, title:nm.title, memory_date:nm.date, description:nm.desc, emoji:"📷", src:imgPrev });
      } else {
        const mem = await db.createMemory(userId, {
          vault_id: vault.id, title: nm.title, description: nm.desc,
          memory_date: nm.date, emoji: "📷", photo_url: photoUrl, photo_path: photoPath,
        });
        if (mem) onMemAdded(mem);
      }
      setAddOpen(false); setNm({title:"",date:"",desc:""}); setImgFile(null); setImgPrev(null);
      setToast({ message:"Memory saved ✓", type:"success" });
    } catch (e) {
      setToast({ message:"Failed to save", type:"error" });
    }
    setSaving(false);
  };

  const deleteMem = async (m) => {
    if (isDemo) { onMemDeleted(m.id); return; }
    if (m.photo_path) await db.deletePhoto(m.photo_path).catch(()=>{});
    await db.deleteMemory(m.id);
    onMemDeleted(m.id);
    setToast({ message:"Memory removed", type:"success" });
  };

  return (
    <div className="fi" style={{ minHeight:"100vh" }}>
      {/* Sticky header */}
      <div className="vault-header" style={{ padding:"36px 48px 28px", borderBottom:"1px solid var(--borderS)", position:"sticky", top:0, zIndex:10, backdropFilter:"blur(20px)", background:`radial-gradient(ellipse at 30% 50%,${vault.color}20 0%,transparent 60%),rgba(26,15,8,0.95)` }}>
        <button onClick={onBack} style={{ color:"var(--cream40)", fontFamily:"'Raleway',sans-serif", fontSize:"11px", letterSpacing:"0.18em", textTransform:"uppercase", marginBottom:"18px", display:"flex", alignItems:"center", gap:"8px", transition:"color 0.2s" }}
          onMouseEnter={e => e.target.style.color="var(--cream70)"}
          onMouseLeave={e => e.target.style.color="var(--cream40)"}>
          ← My Vaults
        </button>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexWrap:"wrap", gap:"14px" }}>
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"6px" }}>
              <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", letterSpacing:"0.24em", color:vault.color, textTransform:"uppercase" }}>{vault.icon} Vault</div>
              {isDemo && <span className="demo-badge">Demo</span>}
            </div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"clamp(32px,5vw,50px)", fontWeight:900, color:"var(--cream)", lineHeight:1, letterSpacing:"-0.02em" }}>{vault.name}</div>
            <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--cream40)", fontWeight:300, marginTop:"5px" }}>{mems.length} memor{mems.length===1?"y":"ies"}</div>
          </div>
          <div className="vault-actions" style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
            {[["🖼", "Collage", () => setShowColl(true)], ["▶", "Slideshow", () => setShowSS(true)], ["✦ AI Import", null, onImportAI, true], ["+ Add", null, () => setAddOpen(true)]].map(([icon, label, fn, gold]) => (
              <button key={icon+label} onClick={fn}
                style={{ background:gold?"linear-gradient(135deg,var(--sunset1),var(--sunset3))":"var(--cream10)", color:gold?"var(--cream)":"var(--cream70)", border:gold?"none":"1px solid var(--borderS)", borderRadius:"8px", padding:"10px 16px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", fontWeight:gold?600:400, letterSpacing:"0.1em", textTransform:"uppercase", transition:"all 0.2s", boxShadow:gold?"0 2px 14px rgba(196,92,42,0.4)":"none", whiteSpace:"nowrap" }}>
                {icon}{label ? ` ${label}` : ""}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Add form */}
      {addOpen && (
        <div className="add-form" style={{ margin:"20px 48px", background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"16px", padding:"22px" }}>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"18px", fontWeight:700, color:"var(--cream)", marginBottom:"16px" }}>Add a Memory</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"12px" }}>
            <div><Lbl>Title</Lbl><FInput value={nm.title} onChange={v => setNm({...nm,title:v})} placeholder="Memory title" /></div>
            <div><Lbl>Date</Lbl><FInput type="date" value={nm.date} onChange={v => setNm({...nm,date:v})} /></div>
          </div>
          <div style={{ marginBottom:"12px" }}>
            <Lbl>Description</Lbl>
            <textarea value={nm.desc} onChange={e => setNm({...nm,desc:e.target.value})} placeholder="Describe this memory..."
              style={{ width:"100%", background:"var(--bg1)", border:"1px solid var(--borderS)", borderRadius:"10px", padding:"12px 14px", color:"var(--cream)", fontSize:"13px", fontFamily:"'Raleway',sans-serif", fontWeight:300, resize:"vertical", minHeight:"70px" }} />
          </div>
          <div style={{ marginBottom:"16px" }}>
            <Lbl>Photo (optional)</Lbl>
            <div onClick={() => fileRef.current.click()} style={{ border:"1px dashed var(--borderS)", borderRadius:"10px", padding:"14px", textAlign:"center", cursor:"pointer", transition:"border-color 0.2s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor="var(--sunset3)"}
              onMouseLeave={e => e.currentTarget.style.borderColor="var(--borderS)"}>
              <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                const f = e.target.files[0]; if (!f) return;
                setImgFile(f);
                const r = new FileReader(); r.onload = ev => setImgPrev(ev.target.result); r.readAsDataURL(f);
              }} />
              {imgPrev ? <img src={imgPrev} alt="" style={{ maxHeight:"100px", borderRadius:"8px", objectFit:"cover" }} />
                : <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"13px", color:"var(--cream40)", fontWeight:300 }}>Click to add a photo</div>}
            </div>
          </div>
          <div style={{ display:"flex", gap:"10px" }}>
            <button onClick={saveAdd} disabled={saving}
              style={{ background:"linear-gradient(135deg,var(--sunset1),var(--sunset3))", color:"var(--cream)", border:"none", borderRadius:"8px", padding:"12px 22px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.1em", textTransform:"uppercase", display:"flex", alignItems:"center", gap:"8px" }}>
              {saving ? <><Spinner />Saving...</> : "Save Memory"}
            </button>
            <button onClick={() => { setAddOpen(false); setImgFile(null); setImgPrev(null); setNm({title:"",date:"",desc:""}); }}
              style={{ background:"transparent", border:"1px solid var(--borderS)", color:"var(--cream40)", borderRadius:"8px", padding:"12px 22px", fontFamily:"'Raleway',sans-serif", fontSize:"12px", letterSpacing:"0.1em", textTransform:"uppercase" }}>Cancel</button>
          </div>
        </div>
      )}

      {/* Timeline */}
      <div className="mem-timeline" style={{ padding:"32px 48px 80px", maxWidth:"800px" }}>
        {mems.length === 0 && (
          <div style={{ textAlign:"center", padding:"70px 20px", color:"var(--cream40)", fontFamily:"'Raleway',sans-serif", fontWeight:300 }}>
            <div style={{ fontSize:"32px", marginBottom:"12px" }}>✦</div>
            <div>This vault is empty.</div>
            <div style={{ marginTop:"8px", fontSize:"13px" }}>Add memories manually or use <span style={{ color:"var(--sunset3)" }}>AI Import</span>.</div>
          </div>
        )}
        {years.map(year => (
          <div key={year} style={{ marginBottom:"40px" }}>
            <div style={{ display:"flex", alignItems:"center", gap:"14px", marginBottom:"4px", paddingLeft:"112px" }}>
              <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"10px", letterSpacing:"0.22em", color:vault.color, textTransform:"uppercase" }}>{year}</div>
              <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg,${vault.color}88,transparent)` }} />
            </div>
            {byYear[year].map((m, idx) => (
              <MemRow key={m.id} m={m} last={idx===byYear[year].length-1} vc={vault.color} onDelete={deleteMem} />
            ))}
          </div>
        ))}
      </div>

      {showSS && <Slideshow mems={mems} vault={vault} onClose={() => setShowSS(false)} />}
      {showColl && <Collage mems={mems} vault={vault} onClose={() => setShowColl(false)} />}
      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  VAULT CARD
// ══════════════════════════════════════════════════════════════
function VaultCard({ vault, count, onOpen, onImport, onDelete }) {
  const [h, setH] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  return (
    <>
      <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
        style={{ position:"relative", background:h?"var(--bg3)":"var(--bg2)", border:`1px solid ${h?vault.color+"55":"var(--border)"}`, borderRadius:"4px", padding:"26px", transition:"all 0.35s", transform:h?"translateY(-5px)":"none", height:"100%", minHeight:"200px", overflow:"hidden", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
        {/* Top color accent */}
        <div style={{ position:"absolute", top:0, left:0, right:0, height:"1.5px", background:`linear-gradient(90deg,${vault.color},transparent)`, opacity:h?1:0.5, transition:"opacity 0.3s" }} />
        {/* Delete button */}
        <button onClick={e => { e.stopPropagation(); setConfirmDel(true); }}
          style={{ position:"absolute", top:"14px", right:"14px", width:"24px", height:"24px", borderRadius:"50%", background:"transparent", border:"1px solid transparent", color:"var(--text20)", fontSize:"12px", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}
          onMouseEnter={e => { e.currentTarget.style.background="rgba(180,50,50,0.12)"; e.currentTarget.style.borderColor="rgba(180,50,50,0.3)"; e.currentTarget.style.color="#F08080"; }}
          onMouseLeave={e => { e.currentTarget.style.background="transparent"; e.currentTarget.style.borderColor="transparent"; e.currentTarget.style.color="var(--text20)"; }}>✕</button>
        {/* Content */}
        <div>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.28em", color:vault.color, textTransform:"uppercase", marginBottom:"16px", fontWeight:600, display:"flex", alignItems:"center", gap:"8px" }}>
            <span>{vault.icon}</span>
            {vault.vault_type || "Vault"}
          </div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"26px", fontWeight:400, color:"var(--text)", marginBottom:"6px", lineHeight:1.1, letterSpacing:"-0.01em", paddingRight:"20px" }}>{vault.name}</div>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300 }}>
            {count} {count===1?"memory":"memories"}
            {vault.start_date && <span style={{ marginLeft:"10px", color:vault.color+"99" }}>· {fmtShort(vault.start_date)}{vault.end_date ? ` — ${fmtShort(vault.end_date)}` : " — Present"}</span>}
          </div>
        </div>
        {/* Actions */}
        <div style={{ display:"flex", gap:"8px", marginTop:"20px" }}>
          <button onClick={onOpen}
            style={{ flex:1, background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"10px 14px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", transition:"all 0.2s" }}>
            Open
          </button>
          <button onClick={e => { e.stopPropagation(); onImport(); }}
            style={{ background:`${vault.color}18`, border:`1px solid ${vault.color}44`, color:vault.color, borderRadius:"60px", padding:"10px 14px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", transition:"all 0.2s" }}
            onMouseEnter={e => { e.currentTarget.style.background=vault.color; e.currentTarget.style.color="var(--bg)"; }}
            onMouseLeave={e => { e.currentTarget.style.background=`${vault.color}18`; e.currentTarget.style.color=vault.color; }}>
            AI Import
          </button>
        </div>
      </div>
      {confirmDel && (
        <ConfirmModal
          title={`Delete "${vault.name}"?`}
          body="This will permanently remove the vault and all its memories. This cannot be undone."
          confirmLabel="Delete Vault"
          confirmDanger
          onConfirm={() => { setConfirmDel(false); onDelete(); }}
          onCancel={() => setConfirmDel(false)}
        />
      )}
    </>
  );
}

// ══════════════════════════════════════════════════════════════
//  HOME
// ══════════════════════════════════════════════════════════════
function Home({ user, vaults, memories, isDemo, onOpenVault, onImportVault, onNewVault, onDeleteVault, onSwitchView, onRevisitDemo }) {
  const [newVOpen, setNewVOpen] = useState(false);
  const [nf, setNf] = useState({ name:"", icon:"◇", color:"#C45C2A", vault_type:"travel", start_date:"", end_date:"" });
  const [creating, setCreating] = useState(false);
  const [vaultStep, setVaultStep] = useState(1);
  const ICONS  = ["◇","◈","◎","⌂","✦","△","○","□"];
  const COLORS = ["#C45C2A","#D4743A","#E8914A","#F0A85C","#E8A840","#AD8060","#D4906A","#B86040"];

  const createVault = async () => {
    if (!nf.name) return;
    const isTimeBound = ["travel","relationship","era"].includes(nf.vault_type);
    setCreating(true);
    try {
      const vaultData = {
        name:nf.name, icon:nf.icon, color:nf.color,
        vault_type:nf.vault_type,
        start_date: isTimeBound && nf.start_date ? nf.start_date : null,
        end_date: isTimeBound && nf.end_date ? nf.end_date : null,
      };
      if (isDemo) {
        onNewVault({ id:uid(), ...vaultData, is_demo:false });
      } else {
        const v = await db.createVault(user.id, vaultData);
        if (v) onNewVault(v);
      }
    } catch(e) {
      console.error("Create vault failed:", e);
    }
    setCreating(false); setNewVOpen(false); setVaultStep(1);
    setNf({name:"",icon:"◇",color:"#C45C2A",vault_type:"travel",start_date:"",end_date:""});
  };

  const VAULT_TYPES = [
    { id:"travel", icon:"🌍", label:"Travel / Trip", desc:"A specific journey with start and end dates" },
    { id:"relationship", icon:"❤️", label:"Relationship", desc:"A romantic partner, dating phase, marriage" },
    { id:"era", icon:"🎓", label:"Life Era", desc:"College years, a job, a city you lived in" },
    { id:"people", icon:"👨‍👩‍👧", label:"Person or Group", desc:"Family, friends, or anyone lifelong" },
    { id:"solo", icon:"✨", label:"Just Me", desc:"Personal growth, hobbies, solo moments" },
  ];

  return (
    <div style={{ maxWidth:"1400px", margin:"0 auto", padding:"52px 48px" }}>

      {/* Hero */}
      <div className="fu" style={{ marginBottom:"64px", paddingBottom:"48px", borderBottom:"1px solid var(--border)" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.38em", color:"var(--sunset)", textTransform:"uppercase", marginBottom:"28px", fontWeight:600, display:"flex", alignItems:"center", gap:"10px" }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:"var(--sunset)", boxShadow:"0 0 10px var(--sunset)", display:"inline-block" }}></span>
          {isDemo ? "Demo Archive" : "Your Archive"}
        </div>
        <h1 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(52px,7vw,96px)", fontWeight:300, color:"var(--text)", lineHeight:0.92, letterSpacing:"-0.04em", marginBottom:"28px" }}>
          {user.name}'s<br/><span className="gold-text">archive.</span>
        </h1>
        <div style={{ display:"flex", gap:"40px", fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:400 }}>
          <div><span style={{ color:"var(--text)", fontWeight:600, marginRight:"6px" }}>{memories.length}</span>memories</div>
          <div><span style={{ color:"var(--text)", fontWeight:600, marginRight:"6px" }}>{vaults.length}</span>vaults</div>
          {isDemo && <span className="demo-badge" style={{ animation:"none" }}>Demo Mode</span>}
        </div>
      </div>

      {/* Featured vault — first vault with a photo */}
      {(() => {
        const featured = vaults.find(v => memories.some(m => (m.vault_id||m.vaultId)===v.id && m.photo_url));
        if (!featured) return null;
        const featuredMem = memories.find(m => (m.vault_id||m.vaultId)===featured.id && m.photo_url);
        const featuredCount = memories.filter(m => (m.vault_id||m.vaultId)===featured.id).length;
        return (
          <div className="fu" style={{ animationDelay:"0.05s", marginBottom:"64px" }}>
            <div onClick={() => onOpenVault(featured)}
              style={{ position:"relative", height:"480px", borderRadius:"4px", overflow:"hidden", cursor:"pointer" }}>
              <div style={{ position:"absolute", inset:0, backgroundImage:`url(${featuredMem.photo_url})`, backgroundSize:"cover", backgroundPosition:"center", transform:"scale(1.02)", transition:"transform 8s ease" }} />
              <div style={{ position:"absolute", inset:0, background:"linear-gradient(180deg, rgba(14,11,10,0.1) 0%, rgba(14,11,10,0.0) 35%, rgba(14,11,10,0.96) 100%)" }} />
              <div style={{ position:"absolute", bottom:"40px", left:"40px", right:"40px" }}>
                <div style={{ display:"inline-block", fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.28em", textTransform:"uppercase", color:"var(--text70)", background:"rgba(14,11,10,0.5)", backdropFilter:"blur(10px)", border:"1px solid rgba(245,239,232,0.15)", padding:"7px 14px", borderRadius:"2px", marginBottom:"20px", fontWeight:600 }}>
                  Featured Vault
                </div>
                <div style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(32px,4vw,56px)", fontWeight:400, color:"var(--text)", lineHeight:1.0, letterSpacing:"-0.02em", marginBottom:"16px" }}>{featured.name}</div>
                <div style={{ display:"flex", gap:"24px", fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text70)", marginBottom:"20px" }}>
                  <span><strong style={{ color:"var(--text)", marginRight:"5px" }}>{featuredCount}</strong>memories</span>
                  {featured.start_date && <span><strong style={{ color:"var(--text)", marginRight:"5px" }}>{fmtShort(featured.start_date)}</strong>{featured.end_date ? `— ${fmtShort(featured.end_date)}` : "— Present"}</span>}
                </div>
                <div style={{ display:"inline-flex", alignItems:"center", gap:"10px", padding:"12px 24px", background:"var(--text)", color:"var(--bg)", borderRadius:"60px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>
                  Open Vault →
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Vault grid */}
      <div className="fu" style={{ animationDelay:"0.08s", marginBottom:"16px", display:"flex", alignItems:"baseline", justifyContent:"space-between" }}>
        <h2 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(28px,3vw,40px)", fontWeight:400, color:"var(--text)", letterSpacing:"-0.02em" }}>
          Your Chapters <span style={{ fontFamily:"'Fraunces',serif", fontStyle:"italic", fontSize:"0.55em", color:"var(--text40)", fontWeight:300, marginLeft:"8px" }}>— {vaults.length} vault{vaults.length!==1?"s":""}</span>
        </h2>
        <button onClick={onSwitchView} style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:500, background:"transparent", border:"none", transition:"color 0.2s" }}
          onMouseEnter={e => e.target.style.color="var(--text)"}
          onMouseLeave={e => e.target.style.color="var(--text40)"}>
          Life Thread →
        </button>
      </div>

      <div className="vault-grid" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:"20px", marginBottom:"64px" }}>
        {vaults.map((v, i) => {
          const vm = memories.filter(m => (m.vault_id||m.vaultId) === v.id);
          return (
            <div key={v.id} className="fu" style={{ animationDelay:`${0.1+i*0.06}s` }}>
              <VaultCard vault={v} count={vm.length} onOpen={() => onOpenVault(v)} onImport={() => onImportVault(v)} onDelete={() => onDeleteVault(v.id)} />
            </div>
          );
        })}
        <div className="fu" style={{ animationDelay:`${0.1+vaults.length*0.06}s` }}>
          <button onClick={() => setNewVOpen(true)}
            style={{ width:"100%", aspectRatio:"4/3", minHeight:"220px", background:"transparent", border:"1px dashed var(--border)", borderRadius:"4px", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:500, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"12px", textTransform:"uppercase", letterSpacing:"0.18em", transition:"all 0.3s", cursor:"pointer" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="var(--sunset)"; e.currentTarget.style.color="var(--text70)"; e.currentTarget.style.background="rgba(232,116,60,0.04)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor="var(--border)"; e.currentTarget.style.color="var(--text40)"; e.currentTarget.style.background="transparent"; }}>
            <span style={{ fontFamily:"'Fraunces',serif", fontSize:"40px", fontWeight:200 }}>+</span>
            New Chapter
          </button>
        </div>
      </div>

      {/* Empty / revisit demo */}
      {!isDemo && vaults.length === 0 && (
        <div style={{ textAlign:"center", padding:"80px 20px" }}>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"18px", fontStyle:"italic", color:"var(--text40)", marginBottom:"24px" }}>Your archive is empty.</div>
          <button onClick={onRevisitDemo}
            style={{ background:"transparent", border:"1px solid var(--borderS)", color:"var(--text40)", borderRadius:"60px", padding:"12px 28px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:500, letterSpacing:"0.18em", textTransform:"uppercase", transition:"all 0.2s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="var(--sunset)"; e.currentTarget.style.color="var(--text70)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor="var(--borderS)"; e.currentTarget.style.color="var(--text40)"; }}>
            ✦ Explore the Demo
          </button>
        </div>
      )}

      {/* Footer */}
      <div style={{ borderTop:"1px solid var(--border)", paddingTop:"32px", display:"flex", justifyContent:"space-between", color:"var(--text20)", fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.18em", textTransform:"uppercase" }}>
        <div>Vault · A Life In Chapters</div>
        <div>Vol. I · MMXXVI</div>
      </div>

      {/* New vault modal — multi-step */}
      {newVOpen && (
        <Modal onClose={() => { setNewVOpen(false); setVaultStep(1); }} maxWidth="460px">
          {vaultStep === 1 && (
            <>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:400, color:"var(--text)", marginBottom:"6px" }}>What kind of chapter?</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, marginBottom:"24px" }}>This helps us place it on your Life Thread.</div>
              <div style={{ display:"flex", flexDirection:"column", gap:"10px" }}>
                {VAULT_TYPES.map(t => (
                  <button key={t.id} onClick={() => setNf({...nf, vault_type:t.id})}
                    style={{ background:nf.vault_type===t.id?"rgba(232,116,60,0.10)":"var(--bg3)", border:`1px solid ${nf.vault_type===t.id?"var(--sunset)":"var(--border)"}`, borderRadius:"6px", padding:"14px 16px", display:"flex", alignItems:"center", gap:"14px", textAlign:"left", transition:"all 0.2s", cursor:"pointer" }}>
                    <span style={{ fontSize:"22px" }}>{t.icon}</span>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"'Fraunces',serif", fontSize:"16px", fontWeight:400, color:"var(--text)", marginBottom:"2px" }}>{t.label}</div>
                      <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300, lineHeight:1.4 }}>{t.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
              <button onClick={() => setVaultStep(2)}
                style={{ width:"100%", background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"14px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", marginTop:"20px" }}>
                Next →
              </button>
            </>
          )}

          {vaultStep === 2 && (
            <>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:400, color:"var(--text)", marginBottom:"22px" }}>Name your vault</div>
              <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>
                <div>
                  <Lbl>Name</Lbl>
                  <FInput value={nf.name} onChange={v => setNf({...nf,name:v})} placeholder={
                    nf.vault_type==="travel" ? "e.g. Italy 2024, Tokyo Trip" :
                    nf.vault_type==="relationship" ? "e.g. Askim, Marriage Years" :
                    nf.vault_type==="era" ? "e.g. College, NYC Years, First Job" :
                    nf.vault_type==="people" ? "e.g. Family, College Friends" :
                    "e.g. Personal Growth, Running"
                  } />
                </div>
                {["travel","relationship","era"].includes(nf.vault_type) && (
                  <>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
                      <div><Lbl>Start Date</Lbl><FInput type="date" value={nf.start_date} onChange={v => setNf({...nf,start_date:v})} /></div>
                      <div><Lbl>End Date (optional)</Lbl><FInput type="date" value={nf.end_date} onChange={v => setNf({...nf,end_date:v})} /></div>
                    </div>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", fontWeight:300, lineHeight:1.6 }}>Leave end date empty if it's ongoing.</div>
                  </>
                )}
                <div>
                  <Lbl>Icon</Lbl>
                  <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                    {ICONS.map(ic => <button key={ic} onClick={() => setNf({...nf,icon:ic})} style={{ width:"36px", height:"36px", borderRadius:"6px", background:nf.icon===ic?"var(--bg4)":"var(--bg3)", border:`1px solid ${nf.icon===ic?"var(--sunset)":"var(--border)"}`, color:"var(--text)", fontSize:"15px", transition:"all 0.15s" }}>{ic}</button>)}
                  </div>
                </div>
                <div>
                  <Lbl>Color</Lbl>
                  <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                    {COLORS.map(c => <button key={c} onClick={() => setNf({...nf,color:c})} style={{ width:"28px", height:"28px", borderRadius:"50%", background:c, border:`2px solid ${nf.color===c?"var(--text)":"transparent"}`, transition:"all 0.15s" }} />)}
                  </div>
                </div>
                <div style={{ display:"flex", gap:"10px", marginTop:"4px" }}>
                  <button onClick={() => setVaultStep(1)}
                    style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"60px", padding:"12px 20px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.14em", textTransform:"uppercase", fontWeight:500 }}>← Back</button>
                  <button onClick={createVault} disabled={creating||!nf.name}
                    style={{ flex:1, background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"12px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", display:"flex", alignItems:"center", justifyContent:"center", gap:"10px", opacity:creating||!nf.name?0.5:1 }}>
                    {creating ? <><Spinner color="var(--bg)" />Creating...</> : "Create Vault"}
                  </button>
                </div>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
}
