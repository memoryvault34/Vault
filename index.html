        <div style={{ display:"flex", justifyContent:"center", marginTop:"18px" }}>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"10px", padding:"10px 24px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  MEMORY CARD — Photo-first editorial layout
// ══════════════════════════════════════════════════════════════
function MemRow({ m, last, vc, onDelete, reverse }) {
  const [h, setH] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const src = m.photo_url || m.src;
  const date = m.memory_date || m.date;
  return (
    <>
      <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
        style={{ display:"grid", gridTemplateColumns: src ? "1fr 1fr" : "1fr", marginBottom:"2px", transition:"transform 0.4s", transform:h?"translateY(-3px)":"none", direction: reverse ? "rtl" : "ltr" }}>
        {/* Photo side */}
        {src && (
          <div style={{ position:"relative", aspectRatio:"4/3", overflow:"hidden", background:"var(--bg3)", direction:"ltr" }}>
            <img src={src} alt={m.title} style={{ width:"100%", height:"100%", objectFit:"cover", filter:"saturate(0.92)", transition:"transform 6s ease", transform:h?"scale(1.04)":"scale(1)" }} />
            {m.mood && m.mood !== "unknown" && (
              <div style={{ position:"absolute", top:"14px", left:"14px", fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.22em", textTransform:"uppercase", background:"rgba(14,11,10,0.65)", backdropFilter:"blur(8px)", color:"rgba(245,239,232,0.85)", padding:"6px 12px", fontWeight:600 }}>
                {m.mood}
              </div>
            )}
          </div>
        )}
        {/* Content side */}
        <div style={{ background:h?"#1E1814":"#181410", border:"1px solid rgba(245,239,232,0.06)", padding:"40px 44px", display:"flex", flexDirection:"column", justifyContent:"center", direction:"ltr", position:"relative", transition:"background 0.3s" }}>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.28em", textTransform:"uppercase", color:"rgba(245,239,232,0.35)", marginBottom:"16px", fontWeight:600 }}>
            {date ? new Date(date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}) : ""}
          </div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(22px,2.5vw,34px)", fontWeight:400, color:"#F5EFE8", lineHeight:1.05, letterSpacing:"-0.02em", marginBottom:"16px" }}>{m.title}</div>
          {(m.description||m.desc) && (
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"14px", color:"rgba(245,239,232,0.58)", lineHeight:1.8, fontWeight:300, marginBottom:"20px" }}>{m.description||m.desc}</div>
          )}
          {m.detectedLocation && (
            <div style={{ display:"flex", alignItems:"center", gap:"6px", fontFamily:"'Inter',sans-serif", fontSize:"10px", color:vc, letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:600 }}>
              <span style={{ width:"4px", height:"4px", borderRadius:"50%", background:vc, display:"inline-block" }}></span>
              {m.detectedLocation}
            </div>
          )}
          {/* Delete button */}
          {h && (
            <button onClick={() => setConfirmDel(true)}
              style={{ position:"absolute", top:"14px", right:"14px", width:"24px", height:"24px", borderRadius:"50%", background:"rgba(180,50,50,0.10)", border:"1px solid rgba(180,50,50,0.25)", color:"rgba(240,128,128,0.6)", fontSize:"11px", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}
              onMouseEnter={e => { e.currentTarget.style.background="rgba(180,50,50,0.2)"; e.currentTarget.style.color="#F08080"; }}
              onMouseLeave={e => { e.currentTarget.style.background="rgba(180,50,50,0.10)"; e.currentTarget.style.color="rgba(240,128,128,0.6)"; }}>✕</button>
          )}
        </div>
      </div>
      {confirmDel && (
        <ConfirmModal
          title="Delete this memory?"
          body={`"${m.title}" will be permanently removed.`}
          confirmLabel="Delete"
          confirmDanger
          onConfirm={() => { setConfirmDel(false); onDelete(m); }}
          onCancel={() => setConfirmDel(false)}
        />
      )}
    </>
  );
}

// ══════════════════════════════════════════════════════════════
//  VAULT DETAIL VIEW
// ══════════════════════════════════════════════════════════════
function VaultView({ vault, mems, userId, onBack, onMemAdded, onMemDeleted, onImportAI, isDemo }) {
  const [showSS, setShowSS] = useState(false);
  const [showColl, setShowColl] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [nm, setNm] = useState({ title:"", date:"", desc:"" });
  const [imgFile, setImgFile] = useState(null);
  const [imgPrev, setImgPrev] = useState(null);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const fileRef = useRef();

  const byYear = {};
  [...mems].sort((a,b) => new Date(a.memory_date||a.date)-new Date(b.memory_date||b.date)).forEach(m => {
    const y = getYr(m.memory_date||m.date);
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(m);
  });
  const years = Object.keys(byYear).sort((a,b) => +a-+b);

  const saveAdd = async () => {
    if (!nm.title || !nm.date) return;
    setSaving(true);
    try {
      let photoUrl = null, photoPath = null;
      if (imgFile && !isDemo) {
        const uploaded = await db.uploadPhoto(userId, imgFile);
        photoUrl = uploaded.url;
        photoPath = uploaded.path;
      }
      if (isDemo) {
        // Demo mode: just create local object
        onMemAdded({ id:uid(), vault_id:vault.id, title:nm.title, memory_date:nm.date, description:nm.desc, emoji:"📷", src:imgPrev });
      } else {
        const mem = await db.createMemory(userId, {
          vault_id: vault.id, title: nm.title, description: nm.desc,
          memory_date: nm.date, emoji: "📷", photo_url: photoUrl, photo_path: photoPath,
        });
        if (mem) onMemAdded(mem);
      }
      setAddOpen(false); setNm({title:"",date:"",desc:""}); setImgFile(null); setImgPrev(null);
      setToast({ message:"Memory saved ✓", type:"success" });
    } catch (e) {
      setToast({ message:"Failed to save", type:"error" });
    }
    setSaving(false);
  };

  const deleteMem = async (m) => {
    if (isDemo) { onMemDeleted(m.id); return; }
    if (m.photo_path) await db.deletePhoto(m.photo_path).catch(()=>{});
    await db.deleteMemory(m.id);
    onMemDeleted(m.id);
    setToast({ message:"Memory removed", type:"success" });
  };

  return (
    <div className="fi" style={{ minHeight:"100vh" }}>
      {/* Vault header */}
      <div className="vault-header" style={{ padding:"32px 48px 24px", borderBottom:"1px solid var(--border)", position:"sticky", top:0, zIndex:10, backdropFilter:"blur(24px)", background:"rgba(14,11,10,0.94)" }}>
        <button onClick={onBack}
          style={{ color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.2em", textTransform:"uppercase", marginBottom:"16px", display:"flex", alignItems:"center", gap:"8px", transition:"color 0.2s", background:"none", border:"none" }}
          onMouseEnter={e => e.currentTarget.style.color="rgba(245,239,232,0.70)"}
          onMouseLeave={e => e.currentTarget.style.color="var(--text40)"}>
          ← My Vaults
        </button>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexWrap:"wrap", gap:"14px" }}>
          <div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.28em", color:vault.color, textTransform:"uppercase", marginBottom:"10px", fontWeight:600, display:"flex", alignItems:"center", gap:"8px" }}>
              <span>{vault.icon}</span>{vault.vault_type || "vault"}{isDemo && <span className="demo-badge" style={{ marginLeft:"4px" }}>Demo</span>}
            </div>
            <div style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(28px,4vw,48px)", fontWeight:300, color:"var(--text)", lineHeight:0.95, letterSpacing:"-0.03em" }}>{vault.name}</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300, marginTop:"8px" }}>
              {mems.length} {mems.length===1?"memory":"memories"}
              {vault.start_date && <span style={{ marginLeft:"14px", color:vault.color+"99" }}>{fmtShort(vault.start_date)}{vault.end_date ? ` — ${fmtShort(vault.end_date)}` : " — Present"}</span>}
            </div>
          </div>
          <div className="vault-actions" style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
            <button onClick={() => setShowColl(true)} style={{ background:"var(--bg3)", border:"1px solid var(--border)", color:"rgba(245,239,232,0.70)", borderRadius:"60px", padding:"9px 18px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", transition:"all 0.2s" }}>Collage</button>
            <button onClick={() => setShowSS(true)} style={{ background:"var(--bg3)", border:"1px solid var(--border)", color:"rgba(245,239,232,0.70)", borderRadius:"60px", padding:"9px 18px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", transition:"all 0.2s" }}>Slideshow</button>
            <button onClick={onImportAI} style={{ background:`${vault.color}18`, border:`1px solid ${vault.color}44`, color:vault.color, borderRadius:"60px", padding:"9px 18px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", transition:"all 0.2s" }}>✦ AI Import</button>
            <button onClick={() => setAddOpen(true)} style={{ background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"9px 18px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase" }}>+ Add</button>
          </div>
        </div>
      </div>

      {/* Add form */}
      {addOpen && (
        <div className="add-form" style={{ margin:"24px 48px", background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"8px", padding:"24px" }}>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"20px", fontWeight:400, color:"var(--text)", marginBottom:"20px" }}>Add a Memory</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"12px" }}>
            <div><Lbl>Title</Lbl><FInput value={nm.title} onChange={v => setNm({...nm,title:v})} placeholder="Memory title" /></div>
            <div><Lbl>Date</Lbl><FInput type="date" value={nm.date} onChange={v => setNm({...nm,date:v})} /></div>
          </div>
          <div style={{ marginBottom:"12px" }}>
            <Lbl>Description</Lbl>
            <textarea value={nm.desc} onChange={e => setNm({...nm,desc:e.target.value})} placeholder="Describe this memory..."
              style={{ width:"100%", background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:"6px", padding:"12px 14px", color:"var(--text)", fontSize:"13px", fontFamily:"'Inter',sans-serif", fontWeight:300, resize:"vertical", minHeight:"80px" }} />
          </div>
          <div style={{ marginBottom:"16px" }}>
            <Lbl>Photo (optional)</Lbl>
            <div onClick={() => fileRef.current.click()} style={{ border:"1px dashed var(--border)", borderRadius:"6px", padding:"16px", textAlign:"center", cursor:"pointer", transition:"border-color 0.2s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor="var(--sunset)"}
              onMouseLeave={e => e.currentTarget.style.borderColor="var(--border)"}>
              <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                const f = e.target.files[0]; if (!f) return;
                setImgFile(f);
                const r = new FileReader(); r.onload = ev => setImgPrev(ev.target.result); r.readAsDataURL(f);
              }} />
              {imgPrev ? <img src={imgPrev} alt="" style={{ maxHeight:"120px", borderRadius:"4px", objectFit:"cover" }} />
                : <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300 }}>Click to add a photo</div>}
            </div>
          </div>
          <div style={{ display:"flex", gap:"10px" }}>
            <button onClick={saveAdd} disabled={saving}
              style={{ background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"12px 28px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", display:"flex", alignItems:"center", gap:"8px" }}>
              {saving ? <><Spinner color="var(--bg)" />Saving...</> : "Save Memory"}
            </button>
            <button onClick={() => { setAddOpen(false); setImgFile(null); setImgPrev(null); setNm({title:"",date:"",desc:""}); }}
              style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"60px", padding:"12px 24px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.14em", textTransform:"uppercase" }}>Cancel</button>
          </div>
        </div>
      )}

      {/* Memory grid — photo-first editorial */}
      <div style={{ maxWidth:"1200px", margin:"0 auto", padding:"0 0 80px" }}>
        {mems.length === 0 && (
          <div style={{ textAlign:"center", padding:"100px 48px", color:"var(--text40)" }}>
            <div style={{ fontFamily:"'Fraunces',serif", fontSize:"18px", fontStyle:"italic", marginBottom:"12px" }}>This vault is empty.</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:300 }}>Add memories manually or use <span style={{ color:"var(--sunset)" }}>AI Import</span>.</div>
          </div>
        )}
        {years.map(year => (
          <div key={year}>
            {/* Year divider */}
            <div style={{ display:"flex", alignItems:"center", gap:"20px", padding:"40px 48px 20px" }}>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"13px", color:vault.color, fontStyle:"italic" }}>{year}</div>
              <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg,${vault.color}44,transparent)` }} />
            </div>
            {byYear[year].map((m, idx) => (
              <MemRow key={m.id} m={m} last={idx===byYear[year].length-1} vc={vault.color} onDelete={deleteMem} reverse={idx%2!==0} />
            ))}
          </div>
        ))}
      </div>

      {showSS && <Slideshow mems={mems} vault={vault} onClose={() => setShowSS(false)} />}
      {showColl && <Collage mems={mems} vault={vault} onClose={() => setShowColl(false)} />}
      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  VAULT CARD
// ══════════════════════════════════════════════════════════════
function VaultCard({ vault, count, onOpen, onImport, onDelete }) {
  const [h, setH] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  return (
    <>
      <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
        style={{ position:"relative", background:h?"var(--bg3)":"var(--bg2)", border:`1px solid ${h?vault.color+"55":"var(--border)"}`, borderRadius:"4px", padding:"26px", transition:"all 0.35s", transform:h?"translateY(-5px)":"none", height:"100%", minHeight:"200px", overflow:"hidden", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
        {/* Top color accent */}
        <div style={{ position:"absolute", top:0, left:0, right:0, height:"1.5px", background:`linear-gradient(90deg,${vault.color},transparent)`, opacity:h?1:0.5, transition:"opacity 0.3s" }} />
        {/* Delete button */}
        <button onClick={e => { e.stopPropagation(); setConfirmDel(true); }}
          style={{ position:"absolute", top:"14px", right:"14px", width:"24px", height:"24px", borderRadius:"50%", background:"transparent", border:"1px solid transparent", color:"var(--text20)", fontSize:"12px", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}
          onMouseEnter={e => { e.currentTarget.style.background="rgba(180,50,50,0.12)"; e.currentTarget.style.borderColor="rgba(180,50,50,0.3)"; e.currentTarget.style.color="#F08080"; }}
          onMouseLeave={e => { e.currentTarget.style.background="transparent"; e.currentTarget.style.borderColor="transparent"; e.currentTarget.style.color="var(--text20)"; }}>✕</button>
        {/* Content */}
        <div>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.28em", color:vault.color, textTransform:"uppercase", marginBottom:"16px", fontWeight:600, display:"flex", alignItems:"center", gap:"8px" }}>
            <span>{vault.icon}</span>
            {vault.vault_type || "Vault"}
          </div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"26px", fontWeight:400, color:"var(--text)", marginBottom:"6px", lineHeight:1.1, letterSpacing:"-0.01em", paddingRight:"20px" }}>{vault.name}</div>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300 }}>
            {count} {count===1?"memory":"memories"}
            {vault.start_date && <span style={{ marginLeft:"10px", color:vault.color+"99" }}>· {fmtShort(vault.start_date)}{vault.end_date ? ` — ${fmtShort(vault.end_date)}` : " — Present"}</span>}
          </div>
        </div>
        {/* Actions */}
        <div style={{ display:"flex", gap:"8px", marginTop:"20px" }}>
          <button onClick={onOpen}
            style={{ flex:1, background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"10px 14px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", transition:"all 0.2s" }}>
            Open
          </button>
          <button onClick={e => { e.stopPropagation(); onImport(); }}
            style={{ background:`${vault.color}18`, border:`1px solid ${vault.color}44`, color:vault.color, borderRadius:"60px", padding:"10px 14px", fontFamily:"'Inter',sans-serif", fontSize:"10px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", transition:"all 0.2s" }}
            onMouseEnter={e => { e.currentTarget.style.background=vault.color; e.currentTarget.style.color="var(--bg)"; }}
            onMouseLeave={e => { e.currentTarget.style.background=`${vault.color}18`; e.currentTarget.style.color=vault.color; }}>
            AI Import
          </button>
        </div>
      </div>
      {confirmDel && (
        <ConfirmModal
          title={`Delete "${vault.name}"?`}
          body="This will permanently remove the vault and all its memories. This cannot be undone."
          confirmLabel="Delete Vault"
          confirmDanger
          onConfirm={() => { setConfirmDel(false); onDelete(); }}
          onCancel={() => setConfirmDel(false)}
        />
      )}
    </>
  );
}

// ══════════════════════════════════════════════════════════════
//  HOME
// ══════════════════════════════════════════════════════════════
function Home({ user, vaults, memories, isDemo, onOpenVault, onImportVault, onNewVault, onDeleteVault, onSwitchView, onRevisitDemo }) {
  const [newVOpen, setNewVOpen] = useState(false);
  const [nf, setNf] = useState({ name:"", icon:"◇", color:"#C45C2A", vault_type:"travel", start_date:"", end_date:"" });
  const [creating, setCreating] = useState(false);
  const [vaultStep, setVaultStep] = useState(1);
  const ICONS  = ["◇","◈","◎","⌂","✦","△","○","□"];
  const COLORS = ["#C45C2A","#D4743A","#E8914A","#F0A85C","#E8A840","#AD8060","#D4906A","#B86040"];

  const createVault = async () => {
    if (!nf.name) return;
    const isTimeBound = ["travel","relationship","era"].includes(nf.vault_type);
    setCreating(true);
    try {
      const vaultData = {
        name:nf.name, icon:nf.icon, color:nf.color,
        vault_type:nf.vault_type,
        start_date: isTimeBound && nf.start_date ? nf.start_date : null,
        end_date: isTimeBound && nf.end_date ? nf.end_date : null,
      };
      if (isDemo) {
        onNewVault({ id:uid(), ...vaultData, is_demo:false });
      } else {
        const v = await db.createVault(user.id, vaultData);
        if (v) onNewVault(v);
      }
    } catch(e) {
      console.error("Create vault failed:", e);
    }
    setCreating(false); setNewVOpen(false); setVaultStep(1);
    setNf({name:"",icon:"◇",color:"#C45C2A",vault_type:"travel",start_date:"",end_date:""});
  };

  const VAULT_TYPES = [
    { id:"travel", icon:"🌍", label:"Travel / Trip", desc:"A specific journey with start and end dates" },
    { id:"relationship", icon:"❤️", label:"Relationship", desc:"A romantic partner, dating phase, marriage" },
    { id:"era", icon:"🎓", label:"Life Era", desc:"College years, a job, a city you lived in" },
    { id:"people", icon:"👨‍👩‍👧", label:"Person or Group", desc:"Family, friends, or anyone lifelong" },
    { id:"solo", icon:"✨", label:"Just Me", desc:"Personal growth, hobbies, solo moments" },
  ];

  return (
    <div style={{ maxWidth:"1400px", margin:"0 auto", padding:"52px 48px" }}>

      {/* Hero */}
      <div className="fu" style={{ marginBottom:"64px", paddingBottom:"48px", borderBottom:"1px solid var(--border)" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.38em", color:"var(--sunset)", textTransform:"uppercase", marginBottom:"28px", fontWeight:600, display:"flex", alignItems:"center", gap:"10px" }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:"var(--sunset)", boxShadow:"0 0 10px var(--sunset)", display:"inline-block" }}></span>
          {isDemo ? "Demo Archive" : "Your Archive"}
        </div>
        <h1 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(52px,7vw,96px)", fontWeight:300, color:"var(--text)", lineHeight:0.92, letterSpacing:"-0.04em", marginBottom:"28px" }}>
          {user.name}'s<br/><span className="gold-text">archive.</span>
        </h1>
        <div style={{ display:"flex", gap:"40px", fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:400 }}>
          <div><span style={{ color:"var(--text)", fontWeight:600, marginRight:"6px" }}>{memories.length}</span>memories</div>
          <div><span style={{ color:"var(--text)", fontWeight:600, marginRight:"6px" }}>{vaults.length}</span>vaults</div>
          {isDemo && <span className="demo-badge" style={{ animation:"none" }}>Demo Mode</span>}
        </div>
      </div>

      {/* Featured vault — first vault with a photo */}
      {(() => {
        const featured = vaults.find(v => memories.some(m => (m.vault_id||m.vaultId)===v.id && m.photo_url));
        if (!featured) return null;
        const featuredMem = memories.find(m => (m.vault_id||m.vaultId)===featured.id && m.photo_url);
        const featuredCount = memories.filter(m => (m.vault_id||m.vaultId)===featured.id).length;
        return (
          <div className="fu" style={{ animationDelay:"0.05s", marginBottom:"64px" }}>
            <div onClick={() => onOpenVault(featured)}
              style={{ position:"relative", height:"480px", borderRadius:"4px", overflow:"hidden", cursor:"pointer" }}>
              <div style={{ position:"absolute", inset:0, backgroundImage:`url(${featuredMem.photo_url})`, backgroundSize:"cover", backgroundPosition:"center", transform:"scale(1.02)", transition:"transform 8s ease" }} />
              <div style={{ position:"absolute", inset:0, background:"linear-gradient(180deg, rgba(14,11,10,0.1) 0%, rgba(14,11,10,0.0) 35%, rgba(14,11,10,0.96) 100%)" }} />
              <div style={{ position:"absolute", bottom:"40px", left:"40px", right:"40px" }}>
                <div style={{ display:"inline-block", fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.28em", textTransform:"uppercase", color:"rgba(245,239,232,0.70)", background:"rgba(14,11,10,0.5)", backdropFilter:"blur(10px)", border:"1px solid rgba(245,239,232,0.15)", padding:"7px 14px", borderRadius:"2px", marginBottom:"20px", fontWeight:600 }}>
                  Featured Vault
                </div>
                <div style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(32px,4vw,56px)", fontWeight:400, color:"var(--text)", lineHeight:1.0, letterSpacing:"-0.02em", marginBottom:"16px" }}>{featured.name}</div>
                <div style={{ display:"flex", gap:"24px", fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"rgba(245,239,232,0.70)", marginBottom:"20px" }}>
                  <span><strong style={{ color:"var(--text)", marginRight:"5px" }}>{featuredCount}</strong>memories</span>
                  {featured.start_date && <span><strong style={{ color:"var(--text)", marginRight:"5px" }}>{fmtShort(featured.start_date)}</strong>{featured.end_date ? `— ${fmtShort(featured.end_date)}` : "— Present"}</span>}
                </div>
                <div style={{ display:"inline-flex", alignItems:"center", gap:"10px", padding:"12px 24px", background:"var(--text)", color:"var(--bg)", borderRadius:"60px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>
                  Open Vault →
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Vault grid */}
      <div className="fu" style={{ animationDelay:"0.08s", marginBottom:"16px", display:"flex", alignItems:"baseline", justifyContent:"space-between" }}>
        <h2 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(28px,3vw,40px)", fontWeight:400, color:"var(--text)", letterSpacing:"-0.02em" }}>
          Your Chapters <span style={{ fontFamily:"'Fraunces',serif", fontStyle:"italic", fontSize:"0.55em", color:"var(--text40)", fontWeight:300, marginLeft:"8px" }}>— {vaults.length} vault{vaults.length!==1?"s":""}</span>
        </h2>
        <button onClick={onSwitchView} style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:500, background:"transparent", border:"none", transition:"color 0.2s" }}
          onMouseEnter={e => e.target.style.color="var(--text)"}
          onMouseLeave={e => e.target.style.color="var(--text40)"}>
          Life Thread →
        </button>
      </div>

      <div className="vault-grid" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:"20px", marginBottom:"64px" }}>
        {vaults.map((v, i) => {
          const vm = memories.filter(m => (m.vault_id||m.vaultId) === v.id);
          return (
            <div key={v.id} className="fu" style={{ animationDelay:`${0.1+i*0.06}s` }}>
              <VaultCard vault={v} count={vm.length} onOpen={() => onOpenVault(v)} onImport={() => onImportVault(v)} onDelete={() => onDeleteVault(v.id)} />
            </div>
          );
        })}
        <div className="fu" style={{ animationDelay:`${0.1+vaults.length*0.06}s` }}>
          <button onClick={() => setNewVOpen(true)}
            style={{ width:"100%", aspectRatio:"4/3", minHeight:"220px", background:"transparent", border:"1px dashed var(--border)", borderRadius:"4px", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:500, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"12px", textTransform:"uppercase", letterSpacing:"0.18em", transition:"all 0.3s", cursor:"pointer" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="var(--sunset)"; e.currentTarget.style.color="rgba(245,239,232,0.70)"; e.currentTarget.style.background="rgba(232,116,60,0.04)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor="var(--border)"; e.currentTarget.style.color="var(--text40)"; e.currentTarget.style.background="transparent"; }}>
            <span style={{ fontFamily:"'Fraunces',serif", fontSize:"40px", fontWeight:200 }}>+</span>
            New Chapter
          </button>
        </div>
      </div>

      {/* Empty / revisit demo */}
      {!isDemo && vaults.length === 0 && (
        <div style={{ textAlign:"center", padding:"80px 20px" }}>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"18px", fontStyle:"italic", color:"var(--text40)", marginBottom:"24px" }}>Your archive is empty.</div>
          <button onClick={onRevisitDemo}
            style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"60px", padding:"12px 28px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:500, letterSpacing:"0.18em", textTransform:"uppercase", transition:"all 0.2s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="var(--sunset)"; e.currentTarget.style.color="rgba(245,239,232,0.70)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor="var(--border)"; e.currentTarget.style.color="var(--text40)"; }}>
            ✦ Explore the Demo
          </button>
        </div>
      )}

      {/* Footer */}
      <div style={{ borderTop:"1px solid var(--border)", paddingTop:"32px", display:"flex", justifyContent:"space-between", color:"var(--text20)", fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.18em", textTransform:"uppercase" }}>
        <div>Vault · A Life In Chapters</div>
        <div>Vol. I · MMXXVI</div>
      </div>

      {/* New vault modal — multi-step */}
      {newVOpen && (
        <Modal onClose={() => { setNewVOpen(false); setVaultStep(1); }} maxWidth="460px">
          {vaultStep === 1 && (
            <>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:400, color:"var(--text)", marginBottom:"6px" }}>What kind of chapter?</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, marginBottom:"24px" }}>This helps us place it on your Life Thread.</div>
              <div style={{ display:"flex", flexDirection:"column", gap:"10px" }}>
                {VAULT_TYPES.map(t => (
                  <button key={t.id} onClick={() => setNf({...nf, vault_type:t.id})}
                    style={{ background:nf.vault_type===t.id?"rgba(232,116,60,0.10)":"var(--bg3)", border:`1px solid ${nf.vault_type===t.id?"var(--sunset)":"var(--border)"}`, borderRadius:"6px", padding:"14px 16px", display:"flex", alignItems:"center", gap:"14px", textAlign:"left", transition:"all 0.2s", cursor:"pointer" }}>
                    <span style={{ fontSize:"22px" }}>{t.icon}</span>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"'Fraunces',serif", fontSize:"16px", fontWeight:400, color:"var(--text)", marginBottom:"2px" }}>{t.label}</div>
                      <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300, lineHeight:1.4 }}>{t.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
              <button onClick={() => setVaultStep(2)}
                style={{ width:"100%", background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"14px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", marginTop:"20px" }}>
                Next →
              </button>
            </>
          )}

          {vaultStep === 2 && (
            <>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:400, color:"var(--text)", marginBottom:"22px" }}>Name your vault</div>
              <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>
                <div>
                  <Lbl>Name</Lbl>
                  <FInput value={nf.name} onChange={v => setNf({...nf,name:v})} placeholder={
                    nf.vault_type==="travel" ? "e.g. Italy 2024, Tokyo Trip" :
                    nf.vault_type==="relationship" ? "e.g. Askim, Marriage Years" :
                    nf.vault_type==="era" ? "e.g. College, NYC Years, First Job" :
                    nf.vault_type==="people" ? "e.g. Family, College Friends" :
                    "e.g. Personal Growth, Running"
                  } />
                </div>
                {["travel","relationship","era"].includes(nf.vault_type) && (
                  <>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
                      <div><Lbl>Start Date</Lbl><FInput type="date" value={nf.start_date} onChange={v => setNf({...nf,start_date:v})} /></div>
                      <div><Lbl>End Date (optional)</Lbl><FInput type="date" value={nf.end_date} onChange={v => setNf({...nf,end_date:v})} /></div>
                    </div>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", fontWeight:300, lineHeight:1.6 }}>Leave end date empty if it's ongoing.</div>
                  </>
                )}
                <div>
                  <Lbl>Icon</Lbl>
                  <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                    {ICONS.map(ic => <button key={ic} onClick={() => setNf({...nf,icon:ic})} style={{ width:"36px", height:"36px", borderRadius:"6px", background:nf.icon===ic?"var(--bg4)":"var(--bg3)", border:`1px solid ${nf.icon===ic?"var(--sunset)":"var(--border)"}`, color:"var(--text)", fontSize:"15px", transition:"all 0.15s" }}>{ic}</button>)}
                  </div>
                </div>
                <div>
                  <Lbl>Color</Lbl>
                  <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                    {COLORS.map(c => <button key={c} onClick={() => setNf({...nf,color:c})} style={{ width:"28px", height:"28px", borderRadius:"50%", background:c, border:`2px solid ${nf.color===c?"var(--text)":"transparent"}`, transition:"all 0.15s" }} />)}
                  </div>
                </div>
                <div style={{ display:"flex", gap:"10px", marginTop:"4px" }}>
                  <button onClick={() => setVaultStep(1)}
                    style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"60px", padding:"12px 20px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.14em", textTransform:"uppercase", fontWeight:500 }}>← Back</button>
                  <button onClick={createVault} disabled={creating||!nf.name}
                    style={{ flex:1, background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"12px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", display:"flex", alignItems:"center", justifyContent:"center", gap:"10px", opacity:creating||!nf.name?0.5:1 }}>
                    {creating ? <><Spinner color="var(--bg)" />Creating...</> : "Create Vault"}
                  </button>
                </div>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
}

//  ONBOARDING WALKTHROUGH — Narrative fullscreen

function OnboardingOverlay({ onDismiss }) {
  const [step, setStep] = useState(0);

  const slides = [
    // Slide 1 — Welcome
    () => (

        <button onClick={onDismiss} style={{ position:"absolute", top:"32px", right:"48px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.18em", textTransform:"uppercase", color:"rgba(245,239,232,0.3)", background:"none", border:"none", cursor:"pointer", fontWeight:400, transition:"color 0.2s" }}
          onMouseEnter={e => e.target.style.color="rgba(245,239,232,0.7)"}
          onMouseLeave={e => e.target.style.color="rgba(245,239,232,0.3)"}>
          Skip →
        </button>
      )}

      {/* Slide content */}
      <div className="fi" key={step} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", width:"100%" }}>
        <SlideContent />
      </div>

      {/* Bottom nav */}
      <div style={{ position:"absolute", bottom:"40px", left:0, right:0, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 48px" }}>
        <button onClick={prev} style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.18em", textTransform:"uppercase", color:"rgba(245,239,232,0.3)", background:"none", border:"none", cursor:"pointer", opacity:step===0?0:1, transition:"color 0.2s", fontWeight:400 }}
          onMouseEnter={e => e.target.style.color="rgba(245,239,232,0.7)"}
          onMouseLeave={e => e.target.style.color="rgba(245,239,232,0.3)"}>← Back</button>

        {/* Dots */}
        <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
          {Array.from({length:total}).map((_,i) => (
            <div key={i} onClick={() => setStep(i)} style={{ width: i===step?"20px":"5px", height:"5px", borderRadius:"3px", background: i===step?"var(--sunset)":i<step?"rgba(232,116,60,0.4)":"rgba(245,239,232,0.15)", transition:"all 0.3s", cursor:"pointer" }} />
          ))}
        </div>

        <button onClick={next} style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.18em", textTransform:"uppercase", color:"#F5EFE8", background:"none", border:"none", cursor:"pointer", fontWeight:600, transition:"opacity 0.2s" }}>
          {step === total - 1 ? "" : step === total - 2 ? "Let's go →" : "Next →"}
        </button>
      </div>
    </div>
  );
}

function MainApp({ user }) {
  const [isDemo, setIsDemo] = useState(user.isNew);
  const [showOnboarding, setShowOnboarding] = useState(user.isNew);
  const [showExitDemo, setShowExitDemo] = useState(false);
  const [view, setView] = useState("home");
  const [vaults, setVaults] = useState(user.isNew ? DEMO_VAULTS : []);
  const [memories, setMemories] = useState(user.isNew ? DEMO_MEMORIES : []);
  const [milestones, setMilestones] = useState(user.isNew ? DEMO_MILESTONES : []);
  const [activeVault, setActiveVault] = useState(null);
  const [importVault, setImportVault] = useState(null);
  const [loading, setLoading] = useState(!user.isNew);
  const [toast, setToast] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  // Load real data from Supabase for returning users
  useEffect(() => {
    if (user.isNew) return;
    const load = async () => {
      setLoading(true);
      try {
        const [v, m, ms, profile] = await Promise.all([
          db.getVaults(user.id),
          db.getMemories(user.id),
          db.getMilestones(user.id),
          db.getProfile(user.id),
        ]);
        setVaults(v);
        setMemories(m);
        setMilestones(ms);
        // Show onboarding if user hasn't seen it yet
        if (!profile?.has_seen_onboarding) {
          setIsDemo(true);
          setVaults(DEMO_VAULTS);
          setMemories(DEMO_MEMORIES);
          setMilestones(DEMO_MILESTONES);
          setShowOnboarding(true);
          // Mark as seen
          await db.updateProfile(user.id, { has_seen_onboarding: true });
        }
      } catch (e) {
        setToast({ message:"Failed to load data", type:"error" });
      }
      setLoading(false);
    };
    load();
  }, [user.id, user.isNew]);

  const openVault = v => { setActiveVault(v); setView("vault"); };

  const deleteVault = async (id) => {
    if (!isDemo) await db.deleteVault(id).catch(()=>{});
    setVaults(p => p.filter(v => v.id !== id));
    setMemories(p => p.filter(m => (m.vault_id||m.vaultId) !== id));
    if (activeVault?.id === id) setView("home");
    setToast({ message:"Vault deleted", type:"success" });
  };

  const exitDemo = () => {
    setIsDemo(false);
    setShowOnboarding(false);
    setVaults([]); setMemories([]); setMilestones([]);
    setView("home"); setShowExitDemo(false);
    setToast({ message:"Welcome! Your vault is ready.", type:"success" });
  };

  const revisitDemo = () => {
    setIsDemo(true);
    setVaults(DEMO_VAULTS);
    setMemories(DEMO_MEMORIES);
    setMilestones(DEMO_MILESTONES);
    setView("home");
    setToast({ message:"You're back in the demo — explore freely!", type:"success" });
  };

  const signOut = async () => {
    await supabase.auth.signOut();
    window.location.reload();
  };

  if (loading) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:300, letterSpacing:"0.35em", marginBottom:"24px" }}><span className="gold-text">VAULT</span></div>
        <Spinner size={20} color="var(--sunset)" />
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg)" }}>
      {isDemo && <DemoBanner onExitDemo={() => setShowExitDemo(true)} />}

      {/* Nav */}
      <nav className="nav-pad" style={{ position:"sticky", top:0, zIndex:50, padding:"16px 48px", display:"flex", justifyContent:"space-between", alignItems:"center", background:"rgba(14,11,10,0.92)", backdropFilter:"blur(24px)", borderBottom:"1px solid var(--border)" }}>
        <div onClick={() => setView("home")} style={{ fontFamily:"'Inter',sans-serif", fontSize:"16px", fontWeight:100, cursor:"pointer", letterSpacing:"0.45em", textTransform:"uppercase" }}>
          <span className="gold-text">VAULT</span>
        </div>
        <div style={{ display:"flex", gap:"4px" }}>
          {[["home","Archive"],["thread","Life Thread"]].map(([v,l]) => (
            <button key={v} onClick={() => setView(v)} style={{ background:view===v?"rgba(232,116,60,0.12)":"transparent", border:"none", color:view===v?"var(--sunset)":"var(--text40)", borderRadius:"6px", padding:"8px 16px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.16em", textTransform:"uppercase", fontWeight:view===v?600:400, transition:"all 0.2s" }}>{l}</button>
          ))}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
          {isDemo && (
            <button onClick={() => setShowExitDemo(true)}
              style={{ background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"8px 20px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>
              Start My Vault
            </button>
          )}
          {/* Hamburger menu */}
          <div style={{ position:"relative" }}>
            <button onClick={() => setMenuOpen(o => !o)}
              style={{ width:"38px", height:"38px", borderRadius:"50%", background:"var(--bg3)", border:"1px solid var(--border)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"4px", transition:"all 0.2s" }}>
              <span style={{ width:"14px", height:"1.5px", background:"rgba(245,239,232,0.70)", display:"block" }}></span>
              <span style={{ width:"14px", height:"1.5px", background:"rgba(245,239,232,0.70)", display:"block" }}></span>
              <span style={{ width:"14px", height:"1.5px", background:"rgba(245,239,232,0.70)", display:"block" }}></span>
            </button>
            {menuOpen && (
              <div className="si" style={{ position:"absolute", top:"48px", right:0, background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"10px", padding:"8px", minWidth:"180px", zIndex:100, boxShadow:"0 16px 48px rgba(0,0,0,0.5)" }}
                onMouseLeave={() => setMenuOpen(false)}>
                <div style={{ padding:"8px 14px 10px", borderBottom:"1px solid var(--border)", marginBottom:"6px" }}>
                  <div style={{ fontFamily:"'Fraunces',serif", fontSize:"14px", color:"var(--text)", fontWeight:500 }}>{user.name}</div>
                  <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", marginTop:"2px" }}>{user.email}</div>
                </div>
                {[
                  { label:"Archive", icon:"◇", action:() => { setView("home"); setMenuOpen(false); } },
                  { label:"Life Thread", icon:"✦", action:() => { setView("thread"); setMenuOpen(false); } },
                ].map(item => (
                  <button key={item.label} onClick={item.action}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:"10px", padding:"10px 14px", borderRadius:"6px", background:"transparent", border:"none", color:"rgba(245,239,232,0.70)", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:300, textAlign:"left", transition:"background 0.15s", cursor:"pointer" }}
                    onMouseEnter={e => e.currentTarget.style.background="var(--bg3)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ color:"var(--text40)", fontSize:"11px" }}>{item.icon}</span>{item.label}
                  </button>
                ))}
                <div style={{ borderTop:"1px solid var(--border)", marginTop:"6px", paddingTop:"6px" }}>
                  <button onClick={signOut}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:"10px", padding:"10px 14px", borderRadius:"6px", background:"transparent", border:"none", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:300, textAlign:"left", transition:"background 0.15s", cursor:"pointer" }}
                    onMouseEnter={e => e.currentTarget.style.background="var(--bg3)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ fontSize:"11px" }}>↗</span>Sign Out
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      </nav>

      {/* Views */}
      {view === "home" && (
        <Home user={user} vaults={vaults} memories={memories} isDemo={isDemo}
          onOpenVault={openVault}
          onImportVault={v => setImportVault(v)}
          onNewVault={v => setVaults(p => [...p, v])}
          onDeleteVault={deleteVault}
          onSwitchView={() => setView("thread")}
          onRevisitDemo={revisitDemo}
        />
      )}

      {view === "thread" && (
        <div style={{ maxWidth:"860px", margin:"0 auto", padding:"52px 48px" }}>
          <div className="fu" style={{ marginBottom:"52px" }}>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.32em", color:"var(--sunset)", textTransform:"uppercase", marginBottom:"16px", fontWeight:600 }}>Life Thread</div>
            <h2 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(36px,5vw,64px)", fontWeight:300, color:"var(--text)", lineHeight:0.95, letterSpacing:"-0.03em" }}>
              <span className="gold-text">Your Timeline.</span>
            </h2>
            <p style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, marginTop:"16px", lineHeight:1.75 }}>Every vault and milestone, woven into one thread.</p>
          </div>
          {milestones.length === 0 && vaults.filter(v => v.start_date).length === 0 && memories.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontWeight:300 }}>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"18px", fontStyle:"italic", marginBottom:"12px" }}>Your timeline is empty.</div>
              <div style={{ fontSize:"13px" }}>Create vaults with dates and they'll appear here.</div>
            </div>
          ) : (
            <GoldenThread milestones={milestones} vaults={vaults} memories={memories} onVaultOpen={openVault} />
          )}
        </div>
      )}

      {view === "vault" && activeVault && (
        <VaultView
          vault={activeVault}
          mems={memories.filter(m => (m.vault_id||m.vaultId) === activeVault.id)}
          userId={user.id}
          onBack={() => setView("home")}
          onMemAdded={m => setMemories(p => [...p, m])}
          onMemDeleted={id => setMemories(p => p.filter(m => m.id !== id))}
          onImportAI={() => setImportVault(activeVault)}
          isDemo={isDemo && activeVault.is_demo}
        />
      )}

      {/* AI Import modal */}
      {importVault && (
        <AIImport
          vault={importVault}
          userId={user.id}
          onDone={mems => {
            setMemories(p => [...p, ...mems]);
            setImportVault(null);
            setToast({ message:`${mems.length} photo${mems.length!==1?"s":""} added ✓`, type:"success" });
          }}
          onClose={() => setImportVault(null)}
        />
      )}

      {showOnboarding && (
        <OnboardingOverlay
          onDismiss={() => setShowOnboarding(false)}
        />
      )}

      {showExitDemo && (
        <ConfirmModal
          title="Ready to start your story?"
          body="The demo vault will be cleared and you'll start with a blank slate — ready to fill with your own memories."
          confirmLabel="Start Fresh →"
          onConfirm={exitDemo}
          onCancel={() => setShowExitDemo(false)}
        />
      )}

      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ROOT — session management
// ══════════════════════════════════════════════════════════════
function Root() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    // Check for existing session
    supabase.auth.getSession().then(async ({ data: { session } }) => {
      if (session?.user) {
        const profile = await db.getProfile(session.user.id);
        setUser({ ...session.user, name: profile?.name || session.user.email?.split("@")[0] || "You", isNew: false });
      }
      setChecking(false);
    });

    // Listen for auth changes
    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_OUT") { setUser(null); }
    });
    return () => subscription.unsubscribe();
  }, []);

  if (checking) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg2)" }}>
      <div style={{ fontFamily:"'Fraunces',serif", fontSize:"32px", fontWeight:900 }}>
        <span className="gold-text">VAULT</span>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg)", color:"var(--text)" }}>
      {!user ? <Auth onAuth={setUser} /> : <MainApp user={user} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
