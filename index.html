    body: "Everything you see is a demo filled with sample memories. Play with it freely — open vaults, add memories, try AI Import, watch a slideshow. Nothing here is real data. When you're ready to start your own story, tap 'Start My Vault' in the top bar.",
    cta: "Explore the Demo →",
    isFinal: true,
  },
];

function OnboardingOverlay({ onDismiss }) {
  const [step, setStep] = useState(0);
  const current = ONBOARDING_STEPS[step];
  const isLast = step === ONBOARDING_STEPS.length - 1;

  const next = () => {
    if (isLast) { onDismiss(); return; }
    setStep(s => s + 1);
  };

  const prev = () => { if (step > 0) setStep(s => s - 1); };

  return (
    <div className="fi" style={{ position:"fixed", inset:0, zIndex:500, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-end", padding:"0 0 40px 0", background:"rgba(10,5,2,0.82)", backdropFilter:"blur(6px)" }}>

      {/* Progress dots */}
      <div style={{ display:"flex", gap:"8px", marginBottom:"20px" }}>
        {ONBOARDING_STEPS.map((_, i) => (
          <div key={i} onClick={() => setStep(i)} style={{ width: i === step ? "24px" : "8px", height:"8px", borderRadius:"40px", background: i === step ? "var(--gold)" : i < step ? "var(--sunset3)" : "rgba(245,237,224,0.2)", transition:"all 0.3s ease", cursor:"pointer" }} />
        ))}
      </div>

      {/* Card */}
      <div className="si" style={{ background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"24px", padding:"32px 28px", width:"100%", maxWidth:"480px", margin:"0 20px" }}>
        <div style={{ textAlign:"center", marginBottom:"20px" }}>
          <div style={{ fontSize:"40px", marginBottom:"14px" }}>{current.emoji}</div>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"24px", fontWeight:700, color:"var(--cream)", marginBottom:"12px", lineHeight:1.1 }}>{current.title}</div>
          <div style={{ fontFamily:"'Raleway',sans-serif", fontSize:"14px", color:"var(--cream70)", fontWeight:300, lineHeight:1.85 }}>{current.body}</div>
        </div>

        {/* Step counter */}
        <div style={{ textAlign:"center", fontFamily:"'Raleway',sans-serif", fontSize:"11px", color:"var(--cream40)", marginBottom:"20px", letterSpacing:"0.1em" }}>
          {step + 1} of {ONBOARDING_STEPS.length}
        </div>

        {/* Buttons */}
        <button onClick={next} style={{ width:"100%", background: current.isFinal ? "linear-gradient(135deg,var(--sunset1),var(--sunset3))" : "var(--cream10)", color: current.isFinal ? "var(--cream)" : "var(--cream70)", border: current.isFinal ? "none" : "1px solid var(--borderS)", borderRadius:"12px", padding:"15px", fontFamily:"'Raleway',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", boxShadow: current.isFinal ? "0 4px 20px rgba(196,92,42,0.4)" : "none", marginBottom:"10px" }}>
          {current.cta}
        </button>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          {step > 0
            ? <button onClick={prev} style={{ background:"transparent", border:"none", color:"var(--cream40)", fontFamily:"'Raleway',sans-serif", fontSize:"12px", fontWeight:300, padding:"6px 0" }}>← Back</button>
            : <div />
          }
          {!current.isFinal && (
            <button onClick={onDismiss} style={{ background:"transparent", border:"none", color:"var(--cream40)", fontFamily:"'Raleway',sans-serif", fontSize:"12px", fontWeight:300, padding:"6px 0" }}>
              Skip — explore on my own
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════════════════════
function MainApp({ user }) {
  const [isDemo, setIsDemo] = useState(user.isNew);
  const [showOnboarding, setShowOnboarding] = useState(user.isNew);
  const [showExitDemo, setShowExitDemo] = useState(false);
  const [view, setView] = useState("home");
  const [vaults, setVaults] = useState(user.isNew ? DEMO_VAULTS : []);
  const [memories, setMemories] = useState(user.isNew ? DEMO_MEMORIES : []);
  const [milestones, setMilestones] = useState(user.isNew ? DEMO_MILESTONES : []);
  const [activeVault, setActiveVault] = useState(null);
  const [importVault, setImportVault] = useState(null);
  const [loading, setLoading] = useState(!user.isNew);
  const [toast, setToast] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  // Load real data from Supabase for returning users
  useEffect(() => {
    if (user.isNew) return;
    const load = async () => {
      setLoading(true);
      try {
        const [v, m, ms] = await Promise.all([
          db.getVaults(user.id),
          db.getMemories(user.id),
          db.getMilestones(user.id),
        ]);
        setVaults(v);
        setMemories(m);
        setMilestones(ms);
      } catch (e) {
        setToast({ message:"Failed to load data", type:"error" });
      }
      setLoading(false);
    };
    load();
  }, [user.id, user.isNew]);

  const openVault = v => { setActiveVault(v); setView("vault"); };

  const deleteVault = async (id) => {
    if (!isDemo) await db.deleteVault(id).catch(()=>{});
    setVaults(p => p.filter(v => v.id !== id));
    setMemories(p => p.filter(m => (m.vault_id||m.vaultId) !== id));
    if (activeVault?.id === id) setView("home");
    setToast({ message:"Vault deleted", type:"success" });
  };

  const exitDemo = () => {
    setIsDemo(false);
    setShowOnboarding(false);
    setVaults([]); setMemories([]); setMilestones([]);
    setView("home"); setShowExitDemo(false);
    setToast({ message:"Welcome! Your vault is ready.", type:"success" });
  };

  const revisitDemo = () => {
    setIsDemo(true);
    setVaults(DEMO_VAULTS);
    setMemories(DEMO_MEMORIES);
    setMilestones(DEMO_MILESTONES);
    setView("home");
    setToast({ message:"You're back in the demo — explore freely!", type:"success" });
  };

  const signOut = async () => {
    await supabase.auth.signOut();
    window.location.reload();
  };

  if (loading) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:300, letterSpacing:"0.35em", marginBottom:"24px" }}><span className="gold-text">VAULT</span></div>
        <Spinner size={20} color="var(--sunset)" />
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg)" }}>
      {isDemo && <DemoBanner onExitDemo={() => setShowExitDemo(true)} />}

      {/* Nav */}
      <nav className="nav-pad" style={{ position:"sticky", top:0, zIndex:50, padding:"16px 48px", display:"flex", justifyContent:"space-between", alignItems:"center", background:"rgba(14,11,10,0.92)", backdropFilter:"blur(24px)", borderBottom:"1px solid var(--border)" }}>
        <div onClick={() => setView("home")} style={{ fontFamily:"'Fraunces',serif", fontSize:"20px", fontWeight:900, cursor:"pointer", letterSpacing:"0.18em" }}>
          <span className="gold-text">VAULT</span>
        </div>
        <div style={{ display:"flex", gap:"4px" }}>
          {[["home","Archive"],["thread","Life Thread"]].map(([v,l]) => (
            <button key={v} onClick={() => setView(v)} style={{ background:view===v?"rgba(232,116,60,0.12)":"transparent", border:"none", color:view===v?"var(--sunset3)":"var(--text40)", borderRadius:"6px", padding:"8px 16px", fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.16em", textTransform:"uppercase", fontWeight:view===v?600:400, transition:"all 0.2s" }}>{l}</button>
          ))}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
          {isDemo && (
            <button onClick={() => setShowExitDemo(true)}
              style={{ background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"8px 20px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase" }}>
              Start My Vault
            </button>
          )}
          {/* Hamburger menu */}
          <div style={{ position:"relative" }}>
            <button onClick={() => setMenuOpen(o => !o)}
              style={{ width:"38px", height:"38px", borderRadius:"50%", background:"var(--bg3)", border:"1px solid var(--border)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"4px", transition:"all 0.2s" }}>
              <span style={{ width:"14px", height:"1.5px", background:"var(--text70)", display:"block" }}></span>
              <span style={{ width:"14px", height:"1.5px", background:"var(--text70)", display:"block" }}></span>
              <span style={{ width:"14px", height:"1.5px", background:"var(--text70)", display:"block" }}></span>
            </button>
            {menuOpen && (
              <div className="si" style={{ position:"absolute", top:"48px", right:0, background:"var(--bg2)", border:"1px solid var(--borderS)", borderRadius:"10px", padding:"8px", minWidth:"180px", zIndex:100, boxShadow:"0 16px 48px rgba(0,0,0,0.5)" }}
                onMouseLeave={() => setMenuOpen(false)}>
                <div style={{ padding:"8px 14px 10px", borderBottom:"1px solid var(--border)", marginBottom:"6px" }}>
                  <div style={{ fontFamily:"'Fraunces',serif", fontSize:"14px", color:"var(--text)", fontWeight:500 }}>{user.name}</div>
                  <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", marginTop:"2px" }}>{user.email}</div>
                </div>
                {[
                  { label:"Archive", icon:"◇", action:() => { setView("home"); setMenuOpen(false); } },
                  { label:"Life Thread", icon:"✦", action:() => { setView("thread"); setMenuOpen(false); } },
                ].map(item => (
                  <button key={item.label} onClick={item.action}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:"10px", padding:"10px 14px", borderRadius:"6px", background:"transparent", border:"none", color:"var(--text70)", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:300, textAlign:"left", transition:"background 0.15s", cursor:"pointer" }}
                    onMouseEnter={e => e.currentTarget.style.background="var(--bg3)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ color:"var(--text40)", fontSize:"11px" }}>{item.icon}</span>{item.label}
                  </button>
                ))}
                <div style={{ borderTop:"1px solid var(--border)", marginTop:"6px", paddingTop:"6px" }}>
                  <button onClick={signOut}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:"10px", padding:"10px 14px", borderRadius:"6px", background:"transparent", border:"none", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:300, textAlign:"left", transition:"background 0.15s", cursor:"pointer" }}
                    onMouseEnter={e => e.currentTarget.style.background="var(--bg3)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ fontSize:"11px" }}>↗</span>Sign Out
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      </nav>

      {/* Views */}
      {view === "home" && (
        <Home user={user} vaults={vaults} memories={memories} isDemo={isDemo}
          onOpenVault={openVault}
          onImportVault={v => setImportVault(v)}
          onNewVault={v => setVaults(p => [...p, v])}
          onDeleteVault={deleteVault}
          onSwitchView={() => setView("thread")}
          onRevisitDemo={revisitDemo}
        />
      )}

      {view === "thread" && (
        <div style={{ maxWidth:"860px", margin:"0 auto", padding:"52px 48px" }}>
          <div className="fu" style={{ marginBottom:"52px" }}>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.32em", color:"var(--sunset)", textTransform:"uppercase", marginBottom:"16px", fontWeight:600 }}>Life Thread</div>
            <h2 style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(36px,5vw,64px)", fontWeight:300, color:"var(--text)", lineHeight:0.95, letterSpacing:"-0.03em" }}>
              <span className="gold-text">Your Timeline.</span>
            </h2>
            <p style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, marginTop:"16px", lineHeight:1.75 }}>Every vault and milestone, woven into one thread.</p>
          </div>
          {milestones.length === 0 && vaults.filter(v => v.start_date).length === 0 && memories.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px", color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontWeight:300 }}>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"18px", fontStyle:"italic", marginBottom:"12px" }}>Your timeline is empty.</div>
              <div style={{ fontSize:"13px" }}>Create vaults with dates and they'll appear here.</div>
            </div>
          ) : (
            <GoldenThread milestones={milestones} vaults={vaults} memories={memories} onVaultOpen={openVault} />
          )}
        </div>
      )}

      {view === "vault" && activeVault && (
        <VaultView
          vault={activeVault}
          mems={memories.filter(m => (m.vault_id||m.vaultId) === activeVault.id)}
          userId={user.id}
          onBack={() => setView("home")}
          onMemAdded={m => setMemories(p => [...p, m])}
          onMemDeleted={id => setMemories(p => p.filter(m => m.id !== id))}
          onImportAI={() => setImportVault(activeVault)}
          isDemo={isDemo && activeVault.is_demo}
        />
      )}

      {/* AI Import modal */}
      {importVault && (
        <AIImport
          vault={importVault}
          userId={user.id}
          onDone={mems => {
            setMemories(p => [...p, ...mems]);
            setImportVault(null);
            setToast({ message:`${mems.length} photo${mems.length!==1?"s":""} added ✓`, type:"success" });
          }}
          onClose={() => setImportVault(null)}
        />
      )}

      {showOnboarding && (
        <OnboardingOverlay
          onDismiss={() => setShowOnboarding(false)}
        />
      )}

      {showExitDemo && (
        <ConfirmModal
          title="Ready to start your story?"
          body="The demo vault will be cleared and you'll start with a blank slate — ready to fill with your own memories."
          confirmLabel="Start Fresh →"
          onConfirm={exitDemo}
          onCancel={() => setShowExitDemo(false)}
        />
      )}

      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ROOT — session management
// ══════════════════════════════════════════════════════════════
function Root() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    // Check for existing session
    supabase.auth.getSession().then(async ({ data: { session } }) => {
      if (session?.user) {
        const profile = await db.getProfile(session.user.id);
        setUser({ ...session.user, name: profile?.name || session.user.email?.split("@")[0] || "You", isNew: false });
      }
      setChecking(false);
    });

    // Listen for auth changes
    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_OUT") { setUser(null); }
    });
    return () => subscription.unsubscribe();
  }, []);

  if (checking) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg1)" }}>
      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"32px", fontWeight:900 }}>
        <span className="gold-text">VAULT</span>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg1)", color:"var(--cream)" }}>
      {!user ? <Auth onAuth={setUser} /> : <MainApp user={user} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
