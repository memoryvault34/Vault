// ── Time of day theming ───────────────────────────────────────
function getTimeOfDay() {
  const h = new Date().getHours();
  if (h >= 5 && h < 8) return "dawn";
  if (h >= 8 && h < 12) return "morning";
  if (h >= 12 && h < 16) return "midday";
  if (h >= 16 && h < 19) return "golden";
  if (h >= 19 && h < 22) return "evening";
  return "night";
}

function applyTimeOfDay() {
  document.body.setAttribute("data-tod", getTimeOfDay());
}
applyTimeOfDay();
// Update every 5 minutes
setInterval(applyTimeOfDay, 5 * 60 * 1000);

const db = {
  async getProfile(userId) {
    const { data } = await supabase.from("profiles").select("*").eq("id", userId).single();
    return data;
  },
  async updateProfile(userId, updates) {
    const { data } = await supabase.from("profiles").update(updates).eq("id", userId).select().single();
    return data;
  },
  async getVaults(userId) {
    const { data } = await supabase.from("vaults").select("*").eq("user_id", userId).order("sort_order").order("created_at");
    return data || [];
  },
  async createVault(userId, vault) {
    const { data } = await supabase.from("vaults").insert({ ...vault, user_id: userId }).select().single();
    return data;
  },
  async deleteVault(vaultId) {
    await supabase.from("vaults").delete().eq("id", vaultId);
  },

    const { data } = await supabase.from("memories").select("*").eq("user_id", userId).order("memory_date");
    return data || [];

    // Always use jpg since we compress to jpeg
    const path = `${userId}/${uid()}.jpg`;
    const { error } = await supabase.storage.from("memory-photos").upload(path, file, { 
      upsert: false,
      contentType: "image/jpeg"
    });
    if (error) {
      console.error("Storage upload error:", error);
      throw error;
    }
    const { data: { publicUrl } } = supabase.storage.from("memory-photos").getPublicUrl(path);
    console.log("Uploaded photo URL:", publicUrl);
    return { url: publicUrl, path };
  },

// ── Real AI analysis via Cloudflare Worker ─────────────────────
async function analyzePhotosWithAI(photos, cfg, vaultName) {
  try {
    const response = await fetch(NETLIFY_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        photos: photos.map(p => ({ id: p.id, name: p.name, src: p.src, date: p.date })),
        prompt: cfg.prompt,
        dateFrom: cfg.from,
        dateTo: cfg.to,
        vaultName: vaultName || "",
      }),
    });
    if (!response.ok) throw new Error("AI function error");
    const { results } = await response.json();
    return results;
  } catch (err) {
    console.warn("AI analysis failed, using fallback:", err);
    return photos.map(p => ({
      ...p,
      aiScore: 0.8,
      aiReason: "Included by default",
      aiTitle: null,
      aiDescription: null,
      aiPick: true,
    }));
  }
}

function Spinner({ size=14, color="var(--text)" }) {
  return <div style={{ width:`${size}px`, height:`${size}px`, border:`1.5px solid ${color}`, borderTopColor:"transparent", borderRadius:"50%", animation:"spin 0.7s linear infinite", flexShrink:0 }} />;
}
function Modal({ onClose, children, maxWidth="480px" }) {
  useEffect(() => {
    const fn = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [onClose]);
  return (
    <div className="fi" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(8,5,4,0.92)", backdropFilter:"blur(20px)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>

        {children}
      </div>
    </div>
  );
}
function Toast({ message, type="success", onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, [onDone]);
  const bg = type === "error" ? "rgba(180,50,50,0.95)" : "rgba(232,116,60,0.95)";
  return (
    <div style={{ position:"fixed", bottom:"24px", left:"50%", transform:"translateX(-50%)", background:bg, color:"#fff", borderRadius:"6px", padding:"12px 24px", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:500, zIndex:999, whiteSpace:"nowrap", boxShadow:"0 8px 32px rgba(0,0,0,0.5)", animation:"fadeUp 0.3s ease both", letterSpacing:"0.02em" }}>
      {message}
    </div>
  );
}

function PasswordInput({ value, onChange, placeholder }) {
  const [show, setShow] = useState(false);
  return (
    <div style={{ position:"relative" }}>
      <input type={show?"text":"password"} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder||"Password"}
        style={{ width:"100%", background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:"6px", padding:"12px 44px 12px 16px", color:"var(--text)", fontSize:"13px", fontFamily:"'Inter',sans-serif", fontWeight:300 }} />
      <button onClick={() => setShow(s=>!s)} style={{ position:"absolute", right:"12px", top:"50%", transform:"translateY(-50%)", color:"var(--text40)", fontSize:"14px", background:"none", border:"none", cursor:"pointer", lineHeight:1, padding:"4px" }}>
        {show ? "🙈" : "👁"}
      </button>
    </div>
  );
}

function PasswordStrength({ password, confirm }) {
  const checks = [
    { label:"8+ characters", ok: password.length >= 8 },
    { label:"One uppercase letter", ok: /[A-Z]/.test(password) },
    { label:"One number", ok: /[0-9]/.test(password) },
    { label:"Passwords match", ok: password.length > 0 && password === confirm },
  ];
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:"6px", marginTop:"2px" }}>
      {checks.map(c => (
        <div key={c.label} style={{ display:"flex", alignItems:"center", gap:"8px", fontFamily:"'Inter',sans-serif", fontSize:"11px", color: c.ok ? "var(--sunset)" : "var(--text40)", fontWeight:400, transition:"color 0.2s" }}>
          <span style={{ width:"14px", height:"14px", borderRadius:"50%", border:`1px solid ${c.ok?"var(--sunset)":"var(--border)"}`, background:c.ok?"var(--sunset)":"transparent", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"8px", color:"var(--bg)", flexShrink:0, transition:"all 0.2s" }}>
            {c.ok ? "✓" : ""}
          </span>
          {c.label}
        </div>
      ))}
    </div>
  );
}

function Auth({ onAuth }) {
  const [screen, setScreen] = useState("land");
  const [f, setF] = useState({ name:"", email:"", password:"", confirm:"", dob:"" });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [resetSent, setResetSent] = useState(false);
  const [confirmSent, setConfirmSent] = useState(false);
  const [resending, setResending] = useState(false);
  const [resendDone, setResendDone] = useState(false);

  const passwordValid = f.password.length >= 8 && /[A-Z]/.test(f.password) && /[0-9]/.test(f.password);
  const signupReady = f.name && f.email && passwordValid && f.password === f.confirm;

  const submit = async () => {
    if (!f.email || !f.password) { setErr("Please fill in all fields."); return; }
    if (screen === "signup") {
      if (!f.name) { setErr("Enter your name."); return; }
      if (!passwordValid) { setErr("Password doesn't meet requirements."); return; }
      if (f.password !== f.confirm) { setErr("Passwords don't match."); return; }
    }
    setLoading(true); setErr("");

    if (screen === "signup") {
      const { data, error } = await supabase.auth.signUp({
        email: f.email, password: f.password,
        options: { data: { name: f.name } },
      });
      if (error) { setErr(error.message); setLoading(false); return; }
      if (data.user) {
        await supabase.from("profiles").update({ name: f.name, dob: f.dob || null }).eq("id", data.user.id);
      }
      setLoading(false);
      setConfirmSent(true);
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email: f.email, password: f.password });
      if (error) {
        if (error.message.includes("Email not confirmed")) {
          setErr("Please confirm your email first.");
          setConfirmSent(true);
        } else {
          setErr(error.message);
        }
        setLoading(false); return;
      }
      const profile = await db.getProfile(data.user.id);
      onAuth({ ...data.user, name: profile?.name || f.email.split("@")[0], isNew: false });
    }
    setLoading(false);
  };

  const resendConfirmation = async () => {
    setResending(true);
    const { error } = await supabase.auth.resend({ type:"signup", email: f.email });
    setResending(false);
    if (!error) setResendDone(true);
  };

  const resetPassword = async () => {
    if (!f.email) { setErr("Enter your email first."); return; }
    setLoading(true);
    const { error } = await supabase.auth.resetPasswordForEmail(f.email, { redirectTo: window.location.origin });
    setLoading(false);
    if (error) { setErr(error.message); return; }
    setResetSent(true);
  };

  const BtnPrimary = ({ onClick, children, loading: l, disabled: d }) => (
    <button onClick={onClick} disabled={l || d}
      style={{ width:"100%", background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"15px", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:600, letterSpacing:"0.16em", textTransform:"uppercase", opacity:l||d?0.4:1, display:"flex", alignItems:"center", justifyContent:"center", gap:"10px", cursor:l||d?"not-allowed":"pointer", transition:"opacity 0.2s" }}>
      {l ? <><Spinner color="var(--bg)" />Processing...</> : children}
    </button>
  );

  if (screen === "land") return (
    <div className="fi" style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"40px 24px", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:"-5%", right:"10%", width:"600px", height:"600px", borderRadius:"50%", background:"radial-gradient(ellipse,rgba(232,116,60,0.18) 0%,transparent 70%)", filter:"blur(60px)", pointerEvents:"none" }} />
      <div style={{ position:"absolute", bottom:"10%", left:"5%", width:"400px", height:"400px", borderRadius:"50%", background:"radial-gradient(ellipse,rgba(180,60,20,0.12) 0%,transparent 70%)", filter:"blur(60px)", pointerEvents:"none" }} />
      <div className="fu" style={{ textAlign:"center", maxWidth:"560px", position:"relative" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.38em", color:"var(--sunset)", textTransform:"uppercase", marginBottom:"32px", fontWeight:600 }}>Memory Archive</div>
        <h1 style={{ fontFamily:"'Inter',sans-serif", fontSize:"clamp(64px,12vw,110px)", fontWeight:100, lineHeight:1.0, letterSpacing:"0.45em", textTransform:"uppercase", marginBottom:"36px" }}>
          <span className="gold-text">VAULT</span>
        </h1>
        <p style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:300, color:"rgba(245,239,232,0.70)", lineHeight:1.6, marginBottom:"16px" }}>Your life, in chapters.</p>
        <p style={{ fontFamily:"'Inter',sans-serif", fontSize:"14px", fontWeight:300, color:"var(--text40)", lineHeight:1.8, marginBottom:"56px" }}>
          Transform your camera roll into a curated archive<br/>of the moments that shaped who you are.
        </p>
        <div style={{ display:"flex", gap:"14px", justifyContent:"center", flexWrap:"wrap" }}>
          <button onClick={() => setScreen("signup")}
            style={{ background:"var(--text)", color:"var(--bg)", border:"none", borderRadius:"60px", padding:"16px 44px", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", transition:"all 0.25s" }}>
            Create Your Vault
          </button>
          <button onClick={() => setScreen("login")}
            style={{ background:"transparent", color:"rgba(245,239,232,0.70)", border:"1px solid var(--border)", borderRadius:"60px", padding:"16px 44px", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:400, letterSpacing:"0.12em", textTransform:"uppercase", transition:"all 0.25s" }}>
            Sign In
          </button>
        </div>
      </div>
      <div style={{ position:"absolute", bottom:0, left:"50%", transform:"translateX(-50%)", display:"flex", flexDirection:"column", alignItems:"center", gap:"10px", paddingBottom:"24px" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.3em", color:"var(--text20)", textTransform:"uppercase" }}>Vol. I · MMXXVI</div>
        <div style={{ width:"1px", height:"50px", background:"linear-gradient(to bottom,var(--sunset),transparent)" }} />
      </div>
    </div>
  );

  return (
    <div className="fi" style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", alignItems:"center", justifyContent:"center", padding:"24px", position:"relative", overflowY:"auto" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:"50%", background:"radial-gradient(ellipse at 50% 0%,rgba(232,116,60,0.10) 0%,transparent 70%)", pointerEvents:"none" }} />
      <div className="si" style={{ width:"100%", maxWidth:"420px", position:"relative", padding:"20px 0" }}>
        <div style={{ textAlign:"center", marginBottom:"36px" }}>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"24px", fontWeight:100, letterSpacing:"0.45em", textTransform:"uppercase" }}>
            <span className="gold-text">VAULT</span>
          </div>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", marginTop:"8px", fontWeight:300, letterSpacing:"0.04em" }}>
            {screen === "signup" ? "Create your memory archive" : screen === "reset" ? "Reset your password" : "Welcome back"}
          </div>
        </div>

        {confirmSent ? (
          <div style={{ textAlign:"center", padding:"10px 0" }}>
            <div style={{ fontSize:"44px", marginBottom:"16px" }}>📬</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"20px", fontWeight:200, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text)", marginBottom:"12px" }}>Check your inbox</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, lineHeight:1.8, marginBottom:"28px" }}>
              We sent a confirmation link to<br/>
              <span style={{ color:"rgba(245,239,232,0.70)", fontWeight:500 }}>{f.email}</span><br/><br/>
              Click the link to activate your vault. Valid for <strong style={{ color:"var(--sunset)" }}>24 hours</strong>.
            </div>
            {resendDone ? (
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--sunset)", fontWeight:500 }}>✓ New link sent!</div>
            ) : (
              <button onClick={resendConfirmation} disabled={resending}
                style={{ background:"var(--bg3)", border:"1px solid var(--border)", color:"rgba(245,239,232,0.70)", borderRadius:"60px", padding:"12px 24px", fontFamily:"'Inter',sans-serif", fontSize:"11px", fontWeight:500, letterSpacing:"0.14em", textTransform:"uppercase", display:"flex", alignItems:"center", justifyContent:"center", gap:"8px", width:"100%", marginBottom:"12px" }}>
                {resending ? <><Spinner color="rgba(245,239,232,0.70)" />Sending...</> : "Resend Confirmation Email"}
              </button>
            )}
            <button onClick={() => { setConfirmSent(false); setScreen("login"); setErr(""); }}
              style={{ color:"var(--text40)", fontFamily:"'Inter',sans-serif", fontSize:"12px", fontWeight:300, marginTop:"12px", background:"none", border:"none", cursor:"pointer" }}>
              ← Back to Sign In
            </button>
          </div>
        ) : resetSent ? (
          <div style={{ textAlign:"center", padding:"20px 0" }}>
            <div style={{ fontSize:"36px", marginBottom:"14px" }}>📬</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"18px", fontWeight:200, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--text)", marginBottom:"12px" }}>Check your email</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, lineHeight:1.7 }}>We sent a password reset link to {f.email}</div>
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:"14px" }}>
            {screen === "signup" && <div><Lbl>Your Name</Lbl><FInput value={f.name} onChange={v => setF({...f,name:v})} placeholder="First name" /></div>}
            <div><Lbl>Email</Lbl><FInput value={f.email} onChange={v => setF({...f,email:v})} placeholder="your@email.com" type="email" /></div>
            {screen !== "reset" && (
              <div>
                <Lbl>Password</Lbl>
                <PasswordInput value={f.password} onChange={v => setF({...f,password:v})} placeholder="Create a password" />
              </div>
            )}
            {screen === "signup" && (
              <>
                <div>
                  <Lbl>Confirm Password</Lbl>
                  <PasswordInput value={f.confirm} onChange={v => setF({...f,confirm:v})} placeholder="Repeat your password" />
                </div>
                <PasswordStrength password={f.password} confirm={f.confirm} />
                <div><Lbl>Date of Birth (optional — for your life timeline)</Lbl><FInput value={f.dob} onChange={v => setF({...f,dob:v})} type="date" /></div>
              </>
            )}
            {err && <div style={{ fontSize:"12px", color:"#F08060", fontFamily:"'Inter',sans-serif", fontWeight:400, padding:"10px 14px", background:"rgba(240,128,96,0.08)", border:"1px solid rgba(240,128,96,0.2)", borderRadius:"6px" }}>{err}</div>}
            <div style={{ marginTop:"4px" }}>
              {screen === "reset"
                ? <BtnPrimary onClick={resetPassword} loading={loading}>Send Reset Link</BtnPrimary>
                : <BtnPrimary onClick={submit} loading={loading} disabled={screen==="signup"&&!signupReady}>
                    {screen === "signup" ? "Create Vault →" : "Sign In →"}
                  </BtnPrimary>
              }
            </div>
          </div>
        )}

        <div style={{ textAlign:"center", marginTop:"24px", display:"flex", flexDirection:"column", gap:"10px" }}>
          {screen === "login" && (
            <button onClick={() => setScreen("reset")} style={{ color:"var(--text40)", fontSize:"12px", fontFamily:"'Inter',sans-serif", fontWeight:300, background:"none", border:"none", cursor:"pointer" }}>
              Forgot password?
            </button>
          )}
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300 }}>
            {screen === "signup" ? "Already have a vault?" : screen === "reset" ? "Remember it?" : "New to Vault?"}{" "}
            <button onClick={() => { setScreen(screen==="signup"?"login":"signup"); setErr(""); setResetSent(false); setF({name:"",email:"",password:"",confirm:"",dob:""}); }}
              style={{ color:"var(--sunset)", fontSize:"13px", fontFamily:"'Inter',sans-serif", fontWeight:500, textDecoration:"none", background:"none", border:"none", cursor:"pointer" }}>
              {screen === "signup" ? "Sign in" : "Create one"}

          <button onClick={() => setScreen("land")} style={{ color:"var(--text40)", fontSize:"12px", fontFamily:"'Inter',sans-serif", fontWeight:300, background:"none", border:"none", cursor:"pointer" }}>← Back</button>
        </div>
      </div>
    </div>
  );

// ══════════════════════════════════════════════════════════════
function GoldenThread({ milestones, vaults, memories, onVaultOpen }) {
  const [activeI, setActiveI] = useState(0);
  const refs = useRef({});

  // Build combined timeline events
  const timelineEvents = [];

  // Add time-bound vaults as "vault" events (with start_date)
  vaults.forEach(v => {
    if (v.start_date && ["travel","relationship","era"].includes(v.vault_type)) {
      timelineEvents.push({
        id: `vault-${v.id}`,
        type: "vault",
        vault: v,
        date: v.start_date,
        endDate: v.end_date,
        title: v.name,
        emoji: v.icon,
        label: v.vault_type === "travel" ? "Trip" : v.vault_type === "relationship" ? "Love" : "Era",
      });
    }
  });

  // Add milestones
  milestones.forEach(m => {
    timelineEvents.push({
      id: m.id,
      type: "milestone",
      date: m.milestone_date || m.date,
      title: m.title,
      emoji: m.emoji,
      label: m.label,
      vault_id: m.vault_id,
    });
  });

  // Add lifelong vault memories (people/solo)
  memories?.forEach(m => {
    const v = vaults.find(vv => vv.id === (m.vault_id || m.vaultId));
    if (v && ["people","solo"].includes(v.vault_type)) {
      timelineEvents.push({
        id: `mem-${m.id}`,
        type: "memory",
        date: m.memory_date || m.date,
        title: m.title,
        emoji: m.emoji || "📷",
        label: v.name,
        vault: v,
        memory: m,
      });
    }
  });

  const sorted = timelineEvents.sort((a,b) => new Date(a.date) - new Date(b.date));

  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActiveI(+e.target.dataset.i); });
    }, { threshold:0.6, rootMargin:"-35% 0px -35% 0px" });
    Object.values(refs.current).forEach(el => el && obs.observe(el));
    return () => obs.disconnect();
  }, [sorted.length]);

  return (
    <div className="thread-container" style={{ position:"relative", padding:"60px 0 100px" }}>
      <div className="thread-line" />
      <div className="thread-glow" />
      {sorted.map((ev, i) => {
        const vault = ev.vault || (ev.vault_id ? vaults.find(v => v.id === ev.vault_id) : null);
        const isLeft = i % 2 === 0;
        const isActive = activeI === i;
        return (
          <div key={ev.id} data-i={i} ref={el => refs.current[i] = el}
            style={{ display:"flex", alignItems:"center", marginBottom:"56px", opacity:isActive?1:0.45, transition:"opacity 0.4s ease" }}>
            <div style={{ flex:1, paddingRight:"50px", textAlign:"right" }}>
              {isLeft && <ThreadCard ev={ev} date={ev.date} vault={vault} dir="right" onVaultOpen={onVaultOpen} />}
            </div>
            <div className={`thread-dot ${isActive?"active":""}`} />
            <div style={{ flex:1, paddingLeft:"50px" }}>
              {!isLeft && <ThreadCard ev={ev} date={ev.date} vault={vault} dir="left" onVaultOpen={onVaultOpen} />}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ThreadCard({ ev, date, vault, dir, onVaultOpen }) {

  const c = vault ? vault.color : "var(--gold)";
  const isVaultBand = ev.type === "vault";
  const photo = ev.memory?.photo_url || ev.memory?.src;
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      onClick={() => vault && onVaultOpen(vault)}
      className="thread-card"
      style={{ display:"inline-block", maxWidth:"340px", textAlign:"left", background:h?`${c}14`:isVaultBand?`${c}0A`:"var(--bg2)", border:`1px solid ${h?c+"55":isVaultBand?c+"30":"var(--border)"}`, borderRadius:"4px", cursor:vault?"pointer":"default", transition:"all 0.3s", transform:h?`translateX(${dir==="right"?"-":""}5px)`:"none", overflow:"hidden" }}>

      {photo && (
        <div style={{ width:"100%", aspectRatio:"16/9", overflow:"hidden", position:"relative" }}>
          <img src={photo} alt={ev.title} style={{ width:"100%", height:"100%", objectFit:"cover", filter:"saturate(0.88)", transition:"transform 6s ease", transform:h?"scale(1.04)":"scale(1)" }} />
          <div style={{ position:"absolute", inset:0, background:"linear-gradient(to top, rgba(14,11,10,0.5), transparent 60%)" }} />
        </div>
      )}
      {/* Content */}
      <div style={{ padding:"18px 20px" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.22em", color:"var(--text40)", textTransform:"uppercase", marginBottom:"8px", fontWeight:600 }}>
          {fmtShort(date)}{ev.endDate ? ` — ${fmtShort(ev.endDate)}` : ev.type === "vault" && !ev.endDate ? " — Present" : ""}
        </div>
        <div className="thread-card-title" style={{ fontFamily:"'Fraunces',serif", fontSize:isVaultBand?"18px":"16px", fontWeight:400, color:"var(--text)", lineHeight:1.1, marginBottom:"6px", letterSpacing:"-0.01em" }}>{ev.title}</div>

          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300, lineHeight:1.6, marginBottom:"8px" }}>{ev.memory.description}</div>
        )}
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"9px", letterSpacing:"0.18em", color:c, textTransform:"uppercase", fontWeight:600 }}>{ev.label}</div>
        {vault && isVaultBand && (
          <div style={{ marginTop:"10px", fontFamily:"'Inter',sans-serif", fontSize:"10px", color:"var(--text40)", letterSpacing:"0.14em", textTransform:"uppercase" }}>Open vault →</div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  AI PHOTO IMPORT
// ══════════════════════════════════════════════════════════════
function AIImport({ vault, userId, onDone, onClose }) {
  const [step, setStep] = useState("cfg");
  const [cfg, setCfg] = useState({ label:"", from:"", to:"", prompt:"" });
  const [photos, setPhotos] = useState([]);
  const [results, setResults] = useState([]);
  const [picked, setPicked] = useState(new Set());
  const [prog, setProg] = useState(0);
  const [uploading, setUploading] = useState(false);
  const dropRef = useRef();
  const fileRef = useRef();

  const compressImage = (src, maxSize=800, quality=0.6) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = src;
    });
  };

  const loadFiles = files => {
    const imgs = []; let done = 0;
    const valid = Array.from(files).filter(f => f.type.startsWith("image/"));
    if (!valid.length) return;
    valid.forEach(f => {
      const r = new FileReader();
      r.onload = async e => {
        // Compress aggressively for AI analysis (small = faster, cheaper)
        const compressed = await compressImage(e.target.result, 512, 0.5);
        // Keep a medium quality version for storage
        const forStorage = await compressImage(e.target.result, 1200, 0.8);
        imgs.push({ id:uid(), name:f.name, src:compressed, storageBlob:forStorage, date:new Date(f.lastModified).toISOString().split("T")[0] });
        done++;
        if (done === valid.length) setPhotos(p => [...p, ...imgs]);
      };
      r.readAsDataURL(f);
    });
  };

  const scan = async () => {
    if (!photos.length) return;
    setStep("scanning"); setProg(0);
    const iv = setInterval(() => setProg(p => { const n = p + Math.random()*7; if(n>=90) clearInterval(iv); return Math.min(n,90); }), 250);
    const r = await analyzePhotosWithAI(photos, cfg, vault.name);
    clearInterval(iv); setProg(100);
    // Merge src back into results so the review screen can show photos
    const enriched = r.map(result => {
      const orig = photos.find(p => p.id === result.id);
      return { ...result, src: orig?.src || result.src };
    });
    setTimeout(() => { setResults(enriched); setPicked(new Set(enriched.filter(x=>x.aiPick).map(x=>x.id))); setStep("review"); }, 400);
  };

  const finish = async () => {
    setUploading(true);
    const chosen = results.filter(r => picked.has(r.id));
    const saved = [];
    for (const photo of chosen) {
      try {
        let photoUrl = null, photoPath = null;

        // Match back to original photo to get storageBlob
        const originalPhoto = photos.find(p => p.id === photo.id);
        const blobSrc = originalPhoto?.storageBlob || originalPhoto?.src || photo.src;

        if (blobSrc && blobSrc.startsWith("data:")) {
          try {
            const res = await fetch(blobSrc);
            const blob = await res.blob();
            const compressedFile = new File([blob], `memory-${uid()}.jpg`, { type: "image/jpeg" });
            const uploaded = await db.uploadPhoto(userId, compressedFile);
            photoUrl = uploaded.url;
            photoPath = uploaded.path;
          } catch(uploadErr) {
            console.error("Upload failed:", uploadErr);
          }
        }

        const title = photo.aiTitle
          || photo.name?.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ")
          || "Memory";
        const mem = await db.createMemory(userId, {
          vault_id: vault.id,
          title,
          description: photo.aiDescription || "Added via AI import.",
          memory_date: photo.date || cfg.from || new Date().toISOString().split("T")[0],
          emoji: "📷",
          photo_url: photoUrl,
          photo_path: photoPath,
          ai_imported: true,
        });
        if (mem) saved.push(mem);
      } catch (e) {
        console.error("Failed to save memory:", e);
      }
    }
    setUploading(false);
    onDone(saved);
  };

  const STEPS = ["cfg","scanning","review"];

  return (
    <div className="fi" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(10,5,2,0.92)", backdropFilter:"blur(16px)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
      <div className="si" onClick={e => e.stopPropagation()} style={{ background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"24px", width:"100%", maxWidth:"640px", maxHeight:"92vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
        {/* Header */}
        <div style={{ background:`linear-gradient(135deg,${vault.color}30,transparent)`, padding:"24px 28px 18px", borderBottom:"1px solid var(--border)", flexShrink:0 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
            <div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.2em", color:vault.color, textTransform:"uppercase", marginBottom:"4px" }}>AI Photo Import</div>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"20px", fontWeight:700, color:"var(--text)" }}>{vault.icon} &nbsp;{vault.name}</div>
            </div>
            <button onClick={onClose} style={{ color:"var(--text40)", fontSize:"20px" }}>✕</button>
          </div>
          <div style={{ display:"flex", marginTop:"18px" }}>
            {["Configure","AI Scanning","Review"].map((s, i) => (
              <div key={s} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:"5px" }}>
                <div style={{ width:"100%", height:"2px", background:i<=STEPS.indexOf(step)?"var(--sunset)":"var(--border)", transition:"background 0.4s" }} />
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", letterSpacing:"0.1em", color:i<=STEPS.indexOf(step)?"var(--sunset3)":"var(--text40)", textTransform:"uppercase" }}>{s}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ flex:1, overflowY:"auto", padding:"24px 28px" }}>
          {/* CONFIGURE */}
          {step === "cfg" && (
            <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>
              <p style={{ fontFamily:"'Inter',sans-serif", fontSize:"14px", color:"rgba(245,239,232,0.70)", fontWeight:300, lineHeight:1.75 }}>
                Claude Vision AI will actually <em>look</em> at your photos — detecting faces, locations, emotions, and events — then pre-select the ones that match what you describe. You make the final call.
              </p>
              <div><Lbl>Vault Theme</Lbl><FInput value={cfg.label} onChange={v => setCfg({...cfg,label:v})} placeholder="e.g. College Years, Europe Trip 2023" /></div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" }}>
                <div><Lbl>Date From</Lbl><FInput type="date" value={cfg.from} onChange={v => setCfg({...cfg,from:v})} /></div>
                <div><Lbl>Date To</Lbl><FInput type="date" value={cfg.to} onChange={v => setCfg({...cfg,to:v})} /></div>
              </div>
              <div>
                <Lbl>What should the AI look for?</Lbl>
                <textarea value={cfg.prompt} onChange={e => setCfg({...cfg,prompt:e.target.value})} placeholder="e.g. Group photos, celebrations, outdoor adventures, moments with specific people..."
                  style={{ width:"100%", background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:"10px", padding:"12px 14px", color:"var(--text)", fontSize:"13px", fontFamily:"'Inter',sans-serif", fontWeight:300, resize:"vertical", minHeight:"80px", lineHeight:1.6 }} />
              </div>
              <div ref={dropRef}
                onDragOver={e => { e.preventDefault(); dropRef.current.style.borderColor="var(--sunset)"; }}
                onDragLeave={() => dropRef.current.style.borderColor="var(--border)"}
                onDrop={e => { e.preventDefault(); dropRef.current.style.borderColor="var(--border)"; loadFiles(e.dataTransfer.files); }}
                onClick={() => fileRef.current.click()}
                style={{ border:"2px dashed var(--border)", borderRadius:"14px", padding:"28px 20px", textAlign:"center", cursor:"pointer", transition:"all 0.2s" }}>
                <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={e => loadFiles(e.target.files)} />
                <div style={{ fontSize:"28px", marginBottom:"10px" }}>📸</div>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, lineHeight:1.65 }}>
                  Drop camera roll photos here or <span style={{ color:"var(--sunset3)" }}>browse files</span>
                </div>
                {photos.length > 0 && <div style={{ marginTop:"10px", fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--sunset)", fontWeight:500 }}>✓ {photos.length} photo{photos.length>1?"s":""} loaded</div>}
              </div>
              <button onClick={scan} disabled={!photos.length}
                style={{ background:photos.length?"linear-gradient(135deg,var(--sunset2),var(--sunset))":"var(--bg3)", color:photos.length?"var(--text)":"var(--text40)", border:"none", borderRadius:"10px", padding:"15px", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", boxShadow:photos.length?"0 4px 20px rgba(196,92,42,0.4)":"none", cursor:photos.length?"pointer":"not-allowed" }}>
                {photos.length ? `Analyze ${photos.length} Photo${photos.length>1?"s":""} with AI →` : "Add Photos First"}
              </button>
            </div>
          )}

          {/* SCANNING */}
          {step === "scanning" && (
            <div style={{ textAlign:"center", padding:"40px 20px" }}>
              <div style={{ fontSize:"42px", marginBottom:"22px", display:"inline-block", animation:"spin 2.5s linear infinite" }}>✦</div>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:"22px", fontWeight:700, color:"var(--text)", marginBottom:"10px" }}>Claude is scanning your photos…</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"var(--text40)", fontWeight:300, marginBottom:"32px", lineHeight:1.75 }}>
                Analyzing faces, locations, emotions &<br/>identifying your most meaningful moments.
              </div>
              <div style={{ background:"var(--bg2)", borderRadius:"40px", height:"4px", overflow:"hidden", maxWidth:"340px", margin:"0 auto" }}>
                <div style={{ height:"100%", width:`${prog}%`, background:"linear-gradient(90deg,var(--sunset2),var(--gold2))", borderRadius:"40px", transition:"width 0.3s ease", boxShadow:"0 0 12px var(--sunset)" }} />
              </div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", color:"var(--text40)", marginTop:"12px" }}>{Math.round(prog)}% complete</div>
            </div>
          )}

          {/* REVIEW */}
          {step === "review" && (
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"14px" }}>
                <div>
                  <div style={{ fontFamily:"'Fraunces',serif", fontSize:"17px", fontWeight:700, color:"var(--text)" }}>
                    AI selected {results.filter(r=>r.aiPick).length} of {results.length} photos
                  </div>
                  <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300, marginTop:"2px" }}>Toggle to adjust — you have the final say.</div>
                </div>
                <div style={{ display:"flex", gap:"8px" }}>
                  <button onClick={() => setPicked(new Set(results.map(r=>r.id)))} style={{ background:"var(--bg3)", border:"1px solid var(--border)", color:"rgba(245,239,232,0.70)", borderRadius:"8px", padding:"5px 12px", fontSize:"11px", fontFamily:"'Inter',sans-serif" }}>All</button>
                  <button onClick={() => setPicked(new Set())} style={{ background:"var(--bg3)", border:"1px solid var(--border)", color:"rgba(245,239,232,0.70)", borderRadius:"8px", padding:"5px 12px", fontSize:"11px", fontFamily:"'Inter',sans-serif" }}>None</button>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:"10px", marginBottom:"20px" }}>
                {results.map(ph => {
                  const sel = picked.has(ph.id);
                  // Look up the original photo for src since results don't include it
                  const originalPhoto = photos.find(p => p.id === ph.id);
                  const imgSrc = ph.src || originalPhoto?.src;
                  return (
                    <div key={ph.id} onClick={() => { const s = new Set(picked); sel ? s.delete(ph.id) : s.add(ph.id); setPicked(s); }}
                      style={{ position:"relative", height:"260px", borderRadius:"12px", overflow:"hidden", cursor:"pointer", border:`2px solid ${sel?"var(--gold)":"transparent"}`, transition:"all 0.2s", background:"var(--bg3)" }}>
                      {imgSrc && <img src={imgSrc} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", opacity:sel?1:0.4, transition:"opacity 0.2s" }} />}
                      {sel && <div style={{ position:"absolute", top:"8px", right:"8px", width:"24px", height:"24px", borderRadius:"50%", background:"var(--gold)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"12px", color:"var(--bg)", fontWeight:700, zIndex:2 }}>✓</div>}
                      {ph.mood && ph.mood !== "unknown" && (
                        <div style={{ position:"absolute", top:"8px", left:"8px", background:"rgba(0,0,0,0.7)", borderRadius:"20px", padding:"3px 9px", fontSize:"10px", color:"rgba(255,255,255,0.9)", fontFamily:"'Inter',sans-serif", textTransform:"capitalize", zIndex:2 }}>{ph.mood}</div>
                      )}
                      {(ph.aiTitle || ph.aiDescription) && (
                        <div style={{ position:"absolute", bottom:0, left:0, right:0, background:"linear-gradient(transparent 0%,rgba(0,0,0,0.6) 30%,rgba(0,0,0,0.92) 100%)", padding:"30px 10px 10px" }}>
                          {ph.aiTitle && <div style={{ fontFamily:"'Fraunces',serif", fontSize:"13px", fontWeight:700, color:"#fff", marginBottom:"4px", lineHeight:1.2 }}>{ph.aiTitle}</div>}
                          {ph.aiDescription && <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", color:"rgba(255,255,255,0.75)", fontWeight:300, lineHeight:1.4 }}>{ph.aiDescription}</div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <button onClick={finish} disabled={uploading || picked.size === 0}
                style={{ width:"100%", background:picked.size?"linear-gradient(135deg,var(--sunset2),var(--sunset))":"var(--bg3)", color:picked.size?"var(--text)":"var(--text40)", border:"none", borderRadius:"10px", padding:"15px", fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", boxShadow:picked.size?"0 4px 20px rgba(196,92,42,0.4)":"none", display:"flex", alignItems:"center", justifyContent:"center", gap:"10px" }}>
                {uploading ? <><Spinner />Saving photos...</> : `Add ${picked.size} Photo${picked.size!==1?"s":""} to Vault →`}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  SLIDESHOW
// ══════════════════════════════════════════════════════════════
function Slideshow({ mems, vault, onClose }) {
  const [i, setI] = useState(0);
  const [vis, setVis] = useState(true);
  const [play, setPlay] = useState(true);
  const timerRef = useRef();

  const go = useCallback(dir => {
    setVis(false);
    setTimeout(() => { setI(p => (p+dir+mems.length)%mems.length); setVis(true); }, 280);
  }, [mems.length]);

  useEffect(() => {
    if (play) timerRef.current = setInterval(() => go(1), 3800);
    return () => clearInterval(timerRef.current);
  }, [play, go]);

  useEffect(() => {
    const fn = e => { if(e.key==="Escape")onClose(); if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1); };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [go, onClose]);

  const m = mems[i]; if (!m) return null;
  const src = m.photo_url || m.src;
  const date = m.memory_date || m.date;
  return (
    <div className="fi" style={{ position:"fixed", inset:0, background:"#000", zIndex:400, display:"flex", flexDirection:"column" }}>
      <div style={{ flex:1, position:"relative", overflow:"hidden" }}>
        {src
          ? <img src={src} style={{ width:"100%", height:"100%", objectFit:"contain", opacity:vis?1:0, transition:"opacity 0.28s" }} alt="" />
          : <div style={{ width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)", opacity:vis?1:0, transition:"opacity 0.28s", fontSize:"90px" }}>{m.emoji}</div>
        }
        <div style={{ position:"absolute", inset:0, background:"linear-gradient(to top,rgba(15,5,0,0.85) 0%,transparent 45%)", pointerEvents:"none" }} />
        <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"40px 40px", opacity:vis?1:0, transition:"opacity 0.28s" }}>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"11px", letterSpacing:"0.2em", color:"var(--sunset3)", textTransform:"uppercase", marginBottom:"8px" }}>{fmtShort(date)}</div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"clamp(22px,4vw,44px)", fontWeight:900, color:"var(--text)", marginBottom:"10px", lineHeight:1.05 }}>{m.title}</div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:"16px", fontStyle:"italic", color:"rgba(245,239,232,0.70)", maxWidth:"480px", lineHeight:1.75 }}>"{m.description||m.desc}"</div>
        </div>
        <button onClick={() => go(-1)} style={{ position:"absolute", left:"16px", top:"50%", transform:"translateY(-50%)", background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--text)", borderRadius:"50%", width:"44px", height:"44px", fontSize:"20px" }}>‹</button>
        <button onClick={() => go(1)}  style={{ position:"absolute", right:"16px", top:"50%", transform:"translateY(-50%)", background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--text)", borderRadius:"50%", width:"44px", height:"44px", fontSize:"20px" }}>›</button>
      </div>
      <div style={{ display:"flex", gap:"3px", padding:"10px 20px", background:"rgba(0,0,0,0.7)" }}>
        {mems.map((_, j) => <div key={j} onClick={() => setI(j)} style={{ flex:1, height:"2px", background:j===i?"var(--gold)":"rgba(245,237,224,0.2)", borderRadius:"2px", cursor:"pointer", transition:"background 0.2s" }} />)}
      </div>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 24px 18px", background:"rgba(0,0,0,0.7)" }}>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:"var(--text40)", fontWeight:300 }}>{i+1} / {mems.length}</div>
        <div style={{ display:"flex", gap:"10px" }}>
          <button onClick={() => setPlay(!play)} style={{ background:"rgba(196,92,42,0.2)", border:"1px solid rgba(196,92,42,0.3)", color:"var(--text)", borderRadius:"8px", padding:"8px 16px", fontFamily:"'Inter',sans-serif", fontSize:"12px", letterSpacing:"0.1em" }}>{play?"⏸ Pause":"▶ Play"}</button>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text40)", borderRadius:"8px", padding:"8px 16px", fontFamily:"'Inter',sans-serif", fontSize:"12px", letterSpacing:"0.1em" }}>✕ Close</button>
        </div>
      </div>
    </div>
  );
}

                      <div style={{ fontFamily:"'Fraunces',serif", fontSize:big?"15px":"11px", color:"rgba(245,239,232,0.70)", textAlign:"center", padding:"0 10px", marginTop:"8px", fontWeight:700 }}>{m.title}</div>
                    </div>
                }
                <div style={{ position:"absolute", inset:0, background:"linear-gradient(to top,rgba(0,0,0,0.65) 0%,transparent 50%)", opacity:0, transition:"opacity 0.2s" }}
                  onMouseEnter={e => e.currentTarget.style.opacity="1"}
                  onMouseLeave={e => e.currentTarget.style.opacity="0"}>
                  <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 10px" }}>
                    <div style={{ fontFamily:"'Fraunces',serif", fontSize:big?"14px":"11px", fontWeight:700, color:"#fff" }}>{m.title}</div>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"10px", color:"rgba(255,255,255,0.6)", marginTop:"2px" }}>{fmtShort(m.memory_date||m.date)}</div>
                  </div>
                </div>
              </div>
            );
          })}
